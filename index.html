<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#84917a"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="512x512" href="icon-512.png"><title>藥物使用紀錄</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#354238;background:#faf8f2}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:22px 18px 95px}h1{font-size:25px;margin:8px 0 20px}h2{font-size:19px}header small{color:#75806f}.card{background:white;border:1px solid #e6e8df;border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 3px 12px #65735b0d}button,select,input,textarea{font:inherit}button{border:0;border-radius:12px;padding:10px 14px;background:#819178;color:white;cursor:pointer}button.secondary{background:#e9eee5;color:#455642}button.danger{background:#f5e6e1;color:#9a4b40}input,select,textarea{border:1px solid #d5dcd1;border-radius:10px;padding:10px;background:white;max-width:100%;width:100%}label{display:block;margin:12px 0 5px;font-size:14px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e4e8df;display:flex;justify-content:center;gap:5px;padding:9px 4px env(safe-area-inset-bottom)}nav button{font-size:12px;flex:1;max-width:155px;background:transparent;color:#6c7868;padding:10px 4px}nav button.active{background:#e9eee5;color:#3c573d}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.muted{color:#798476;font-size:13px}.pill{border-radius:50px;background:#eef1e9;padding:5px 9px;font-size:12px}.warn{color:#a15a31}.photo{width:64px;height:64px;object-fit:cover;border-radius:12px;background:#e9eee5}.medrow{display:flex;gap:12px;align-items:center}.medrow>div{flex:1}.hidden{display:none}form{margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}p{line-height:1.6}</style></head><body><main><header><small>PERSONAL MEDICATION JOURNAL</small><h1>藥物使用紀錄</h1><label for="person">目前查看</label><select id="person"><option value="自己">自己</option></select><div class="row" style="margin-top:8px"><button class="secondary" onclick="addFamily()">＋ 新增家人</button><button class="secondary" onclick="renameFamily()">修改家人名稱</button></div><select id="unused" class="hidden"></select></header><section id="content"></section><section class="card"><h2>資料備份</h2><p class="muted">下載 JSON 備份檔，保存自己與家人的藥物、補給及服藥紀錄。檔案含個人健康資料，請妥善保管。</p><div class="row"><button class="secondary" onclick="exportData()">下載備份</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">還原備份</button></div><input class="hidden" type="file" id="restoreFile" accept=".json,application/json" onchange="importData(event)"></section></main><nav><button data-tab="today" class="active">今日用藥</button><button data-tab="meds">我的藥物</button><button data-tab="stock">庫存管理</button><button data-tab="history">歷史紀錄</button><button data-tab="reminders">用藥提醒</button></nav><script>
const KEY='medication-journal-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{meds:[],logs:[]}}catch{db={meds:[],logs:[]}}db.families=db.families||[...new Set(db.meds.map(m=>m.person).filter(p=>p!=='自己'))];db.restocks=db.restocks||[];db.reminders=db.reminders||{};db.reminderTimes=db.reminderTimes||{};let tab='today';const $=id=>document.getElementById(id),person=()=> $('person').value;const today=()=>new Date().toLocaleDateString('sv-SE');const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()};const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const meds=()=>db.meds.filter(m=>m.person===person()&&m.active!==false);const allMeds=()=>db.meds.filter(m=>m.person===person());const low=m=>m.stock<=m.threshold||(m.type==='fixed'&&m.daily>0&&m.days>0&&m.stock/m.daily<=m.days);const pic=m=>m.photo?`<img class="photo" src="${m.photo}" alt="藥物照片">`:'<span class="photo" style="display:grid;place-items:center">💊</span>';
function lineMessage(m){
 return `藥物庫存提醒\n使用者：${m.person}\n藥物：${m.name}`;
}
async function imageFile(m){
 if(!m.photo)return null;
 const response=await fetch(m.photo);
 const blob=await response.blob();
 const type=blob.type||'image/png';
 const ext=type.includes('jpeg')?'jpg':type.includes('webp')?'webp':'png';
 return new File([blob],`藥物照片.${ext}`,{type});
}
function shareText(m){
 window.open('https://line.me/R/msg/text/?'+encodeURIComponent(lineMessage(m)),'_blank','noopener,noreferrer');
}
async function shareLine(id){
 const m=db.meds.find(x=>x.id===id);
 if(!m)return alert('找不到藥物。');
 if(m.photo&&navigator.share){
  try{
   const file=await imageFile(m);
   if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    await navigator.share({text:lineMessage(m),files:[file]});
    return;
   }
  }catch(e){
   if(e.name==='AbortError')return;
  }
 }
 shareText(m);
 if(m.photo)alert('目前僅開啟文字分享。若要附上藥物圖片，請從藥物資料卡下載照片，再於 LINE 手動附加。');
}
function downloadMedPhoto(id){
 const m=db.meds.find(x=>x.id===id);
 if(!m?.photo)return alert('這筆藥物尚未上傳照片。');
 const a=document.createElement('a');
 a.href=m.photo;a.download='藥物照片.png';document.body.appendChild(a);a.click();a.remove();
}
function refreshPeople(){const el=$('person'),old=el.value;el.innerHTML=['自己',...db.families.filter(x=>x!=='自己')].map(x=>`<option value="${safe(x)}">${safe(x)}</option>`).join('');if([...el.options].some(o=>o.value===old))el.value=old;}
function addFamily(){let name=prompt('請輸入家人名稱');if(name===null)return;name=name.trim();if(!name||name==='自己'||db.families.includes(name))return alert('名稱不可空白或重複。');db.families.push(name);refreshPeople();$('person').value=name;save()}
function renameFamily(){let old=person();if(old==='自己')return alert('「自己」不能重新命名。');let name=prompt('修改家人名稱',old);if(name===null)return;name=name.trim();if(!name||name==='自己'||(name!==old&&db.families.includes(name)))return alert('名稱不可空白或重複。');db.families=db.families.map(x=>x===old?name:x);db.meds.forEach(m=>{if(m.person===old)m.person=name});$('person').value=old;refreshPeople();$('person').value=name;save()}
const remaining=m=>m.type==='fixed'&&m.daily>0?Math.floor(m.stock/m.daily):null;
function purchaseList(){let selected=meds().filter(m=>document.getElementById('buy-'+m.id)?.checked);if(!selected.length)return alert('請先勾選要購買的藥物。');let lines=['💊 藥物採購清單','使用者：'+person(),'日期：'+today(),'','📦 待購藥物'];for(let i=0;i<selected.length;i++){let m=selected[i],qty=Number($('buyqty-'+m.id).value),unit=$('buyunit-'+m.id).value.trim();if(!Number.isFinite(qty)||qty<=0||!unit)return alert('請填寫有效的購買數量與單位。');lines.push(`${i+1}. ${m.name}：${qty} ${unit}`)}return {text:lines.join('\n'),selected}}
async function sharePurchase(){let result=purchaseList();if(!result)return;let {text,selected}=result;let files=[];for(const m of selected){if(m.photo){try{files.push(await imageFile(m))}catch{}}}files=files.filter(Boolean);if(navigator.share){try{if(files.length&&navigator.canShare?.({files})){await navigator.share({text,files});return}await navigator.share({text});return}catch(e){if(e.name==='AbortError')return}}window.open('https://line.me/R/msg/text/?'+encodeURIComponent(text),'_blank','noopener,noreferrer');if(files.length)alert('文字已交給 LINE；若圖片未一起出現，請在 LINE 另外附加照片。')}
function confirmRestocks(){let updates=[];for(const m of meds()){let q=Number($('restock-'+m.id)?.value||0);if(!Number.isFinite(q)||q<0)return alert('補給數量不可為負數。');if(q>0)updates.push({m,q})}if(!updates.length)return alert('請輸入新增補給數量。');if(!confirm('確認已收到這些藥物並增加實際庫存？'))return;for(const {m,q} of updates){m.stock=+(m.stock+q).toFixed(4);db.restocks.push({id:crypto.randomUUID(),medId:m.id,qty:q,at:new Date().toISOString()})}save()}
function requestNotifications(){if(!('Notification' in window))return alert('此裝置或瀏覽器不支援通知。');Notification.requestPermission().then(x=>alert('通知權限：'+x+'。這不是背景推播啟用確認；仍需另外建置推播服務。'))}
// 本機提醒設定只針對「自己」，不因查看其他家人而變更。
function reminderKey(m){return String(m.id)}
function reminderEnabled(m){return db.reminders[reminderKey(m)]!==false}
function setReminder(id,enabled){db.reminders[id]=enabled;save()}
function reminderTimes(m){
 const id=reminderKey(m),stored=db.reminderTimes[id];
 if(Array.isArray(stored))return stored.filter(t=>/^([01]\d|2[0-3]):[0-5]\d$/.test(t)).sort();
 return String(m.times||'').split(',').map(t=>t.trim()).filter(t=>/^([01]\d|2[0-3]):[0-5]\d$/.test(t));
}
function addReminderTime(id){
 const input=document.getElementById('new-time-'+id),t=input?.value;
 if(!t||!/^([01]\d|2[0-3]):[0-5]\d$/.test(t))return alert('請選擇有效的提醒時間');
 const m=db.meds.find(x=>String(x.id)===String(id));if(!m||m.person!=='自己')return;
 const a=reminderTimes(m);if(a.includes(t))return alert('這個時間已經設定過了');
 db.reminderTimes[id]=[...a,t].sort();save();
}
function removeReminderTime(id,t){
 const m=db.meds.find(x=>String(x.id)===String(id));if(!m||m.person!=='自己')return;
 db.reminderTimes[id]=reminderTimes(m).filter(x=>x!==t);save();
}
function editReminderTime(id,oldTime,idx){
 const input=document.getElementById('edit-time-'+id+'-'+idx),t=input?.value;
 if(!t||!/^([01]\d|2[0-3]):[0-5]\d$/.test(t))return alert('請選擇有效的提醒時間');
 const m=db.meds.find(x=>String(x.id)===String(id));if(!m||m.person!=='自己')return;
 const a=reminderTimes(m);if(t!==oldTime&&a.includes(t))return alert('這個時間已經設定過了');
 db.reminderTimes[id]=a.map(x=>x===oldTime?t:x).sort();save();
}
function ownFixedMeds(){return db.meds.filter(m=>m.person==='自己'&&m.active!==false&&m.type==='fixed')}
function reminderPanel(){
 let list=ownFixedMeds(),out='<h2>每日用藥提醒（僅限自己）</h2><div class="card"><strong>提醒對象固定為「自己」</strong><p class="muted">不論上方切換查看哪位家人，此頁只顯示本機「自己」的固定用藥。設定會保存在這支手機。</p><p class="muted">目前提供 App 內到時／逾時提示及提醒開關。iPhone 關閉 App 後的背景推播尚未啟用，不能依賴本功能作為唯一服藥提醒。</p><button class="secondary" onclick="requestNotifications()">檢查通知權限（非啟用背景推播）</button></div>';
 if(!list.length)return out+'<div class="card">「自己」尚未建立固定服用藥物。請先切換至「自己」，到「我的藥物」建立藥物及時間。</div>';
 let now=new Date(),clock=now.toTimeString().slice(0,5);
 for(const m of list){
  let times=reminderTimes(m),on=reminderEnabled(m);
  let entries=times.map((t,i)=>{
   // 提醒時段與原服藥時段分開；不可把提醒狀態誤認為服藥確認。
   let state=t<=clock?'已到提醒時間':'尚未到提醒時間';
   return `<div class="muted" style="margin:7px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap"><input aria-label="提醒時間" type="time" id="edit-time-${m.id}-${i}" value="${safe(t)}" style="width:130px"><button class="secondary" onclick="editReminderTime('${m.id}','${t}',${i})">修改</button><button class="secondary" onclick="removeReminderTime('${m.id}','${t}')">刪除</button><span>${state}</span></div>`;
  }).join('');
  out+=`<div class="card medrow">${pic(m)}<div style="flex:1;min-width:0"><strong>${safe(m.name)}</strong><div class="muted">每次 ${safe(m.dose)} ${safe(m.unit)}</div>${entries||'<div class="muted">請設定提醒時間</div>'}<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px"><input type="time" aria-label="新增提醒時間" id="new-time-${m.id}" value="08:00" style="width:130px"><button class="secondary" onclick="addReminderTime('${m.id}')">＋ 新增時間</button></div></div><label style="white-space:nowrap"><input type="checkbox" style="width:auto" ${on?'checked':''} onchange="setReminder('${m.id}',this.checked)"> 提醒</label></div>`;
 }
 return out+'<p class="muted">提醒時間獨立於原服藥排程，不會自動新增服藥紀錄或扣庫存。此頁顯示提醒時段，App 關閉後尚無背景推播。</p>';
}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let out='';if(tab==='reminders'){out=reminderPanel()}if(tab==='today'){out=`<h2>今日用藥 <span class="muted">${today()}</span></h2><div class="card"><strong>每日用藥提醒</strong><p class="muted">開啟 App 可查看今日用藥與服藥確認。iPhone 在 App 關閉後的定時推播尚需後端推播服務，現階段尚未啟用。</p><button class="secondary" onclick="requestNotifications()">檢查通知權限</button></div>`;let fixed=meds().filter(m=>m.type==='fixed');out+=fixed.length?'':'<div class="card">尚未建立固定服用的藥物，請到「我的藥物」新增。</div>';for(const m of fixed){let times=(m.times||'').split(',').map(x=>x.trim()).filter(Boolean);for(const t of times){let done=db.logs.some(l=>l.medId===m.id&&l.slot===t&&l.date===today());out+=`<div class="card medrow">${pic(m)}<div><strong>${safe(m.name)}</strong><div class="muted">${safe(t)} · ${m.dose} ${safe(m.unit)}</div></div><button class="${done?'secondary':''}" onclick="toggleDose('${m.id}','${safe(t)}')">${done?'✓ 已服用':'已服用'}</button></div>`}}out+='<h2>需要時服用</h2>';let prn=meds().filter(m=>m.type==='prn');out+=prn.length?'':'<div class="card">尚未建立需要時服用的藥物。</div>';for(const m of prn)out+=`<div class="card medrow">${pic(m)}<div><strong>${safe(m.name)}</strong><div class="muted">庫存 ${m.stock} ${safe(m.unit)}</div></div><button onclick="takePrn('${m.id}')">記錄服用</button></div>`}
if(tab==='meds'){out='<h2>我的藥物</h2><button onclick="showForm()">＋ 新增藥物</button><div id="editor"></div>';for(const m of meds())out+=`<div class="card medrow">${pic(m)}<div><strong>${safe(m.name)}</strong><div class="muted">${safe(m.info||'尚未填寫用途')} · ${m.type==='fixed'?'固定服用':'需要時服用'}</div><div class="muted">庫存 ${m.stock} ${safe(m.unit)}</div></div><button class="secondary" onclick="showForm('${m.id}')">編輯</button></div>`}
if(tab==='stock'){out='<h2>庫存管理</h2><h3>庫存剩餘天數提醒</h3>';for(const m of meds()){let days=remaining(m);out+=`<div class="card row"><div><strong>${safe(m.name)}</strong><div class="muted">庫存 ${m.stock} ${safe(m.unit)} · ${days===null?'不固定服用，無法估算天數':`約剩 ${days} 天`}</div></div><span class="${low(m)?'warn':'muted'}">${low(m)?'⚠️ 需留意':'正常'}</span></div>`}out+='<h3>實際藥物補給</h3><p class="muted">僅在實際領取或購買到藥物後填寫；以顆、錠、毫升等庫存單位計算。</p>';for(const m of meds())out+=`<div class="card"><strong>${safe(m.name)}</strong><div class="muted">目前庫存：${m.stock} ${safe(m.unit)}</div><label>新增補給數量（${safe(m.unit)}）</label><input id="restock-${m.id}" type="number" min="0" step="any" value="0"></div>`;out+='<button onclick="confirmRestocks()">確認補給並更新庫存</button><h3>待購藥物清單</h3><p class="muted">購買數量是盒、瓶、包等包裝數量，不會改變實際庫存。只分享勾選項目，LINE 訊息不包含庫存與剩餘天數。</p>';for(const m of meds())out+=`<div class="card"><label><input style="width:auto" type="checkbox" id="buy-${m.id}"> <strong>${safe(m.name)}</strong></label><div class="grid"><div><label>購買數量</label><input type="number" min="0.001" step="any" id="buyqty-${m.id}" value="${Number(m.buyQty)||1}"></div><div><label>購買單位</label><input id="buyunit-${m.id}" value="${safe(m.buyUnit||'盒')}"></div></div>${m.photo?`<div class="muted">📷 已有藥物照片</div>`:''}</div>`;out+='<button onclick="sharePurchase()">LINE 分享勾選的採購清單</button>';if(!meds().length)out+='<div class="card">目前沒有正在使用的藥物。</div>'}
if(tab==='history'){out='<h2>服藥歷史</h2>';let ids=new Set(meds().map(m=>m.id));let logs=db.logs.filter(l=>ids.has(l.medId)).sort((a,b)=>b.at.localeCompare(a.at));for(const l of logs){let m=db.meds.find(m=>m.id===l.medId);out+=`<div class="card row"><div><strong>${safe(m?.name||'已刪除藥物')}</strong><div class="muted">${safe(l.at.replace('T',' '))} · ${l.qty} ${safe(m?.unit||'')}</div></div><button class="secondary" onclick="undo('${l.id}')">撤銷</button></div>`}if(!logs.length)out+='<div class="card">尚無服藥紀錄。</div>'} $('content').innerHTML=out}
function addLog(m,qty,slot=''){if(!Number.isFinite(qty)||qty<=0)return alert('服用量必須大於 0，可以輸入整數或小數。');if(m.stock<qty)return alert('庫存不足，請先補充庫存。');m.stock=+(m.stock-qty).toFixed(4);db.logs.push({id:crypto.randomUUID(),medId:m.id,qty,slot,date:today(),at:new Date().toLocaleString('sv-SE').replace(' ','T')});save();if(low(m))alert(`${m.name} 已達庫存提醒條件。`)}
function undo(id){let i=db.logs.findIndex(l=>l.id===id);if(i<0)return;let l=db.logs[i],m=db.meds.find(m=>m.id===l.medId);if(m)m.stock=+(m.stock+l.qty).toFixed(4);db.logs.splice(i,1);save()}
function toggleDose(id,slot){let m=db.meds.find(x=>x.id===id);let l=db.logs.find(x=>x.medId===id&&x.slot===slot&&x.date===today());if(l){if(confirm('取消這次服藥紀錄並恢復庫存？'))undo(l.id)}else addLog(m,m.dose,slot)}
function takePrn(id){let m=db.meds.find(x=>x.id===id);let q=Number(prompt(`本次服用 ${m.name} 幾${m.unit}？`,m.dose));if(Number.isFinite(q)&&q>0)addLog(m,q)}
function restock(id){let m=db.meds.find(x=>x.id===id),q=Number(prompt(`要補充多少 ${m.unit}？`,'10'));if(Number.isFinite(q)&&q>0){m.stock=+(m.stock+q).toFixed(4);save()}}
function showForm(id){let m=db.meds.find(x=>x.id===id)||{name:'',info:'',type:'fixed',unit:'顆',dose:1,daily:1,stock:0,threshold:10,days:7,times:'08:00',photo:''};$('editor').innerHTML=`<form class="card" id="medform"><h2>${id?'編輯藥物':'新增藥物'}</h2><div class="grid"><div class="full"><label>藥物名稱</label><input name="name" required value="${safe(m.name)}"></div><div class="full"><label>搜尋藥物圖片</label><div class="row"><input id="lookupTerm" placeholder="輸入藥物名稱或外觀特徵" value="${safe(m.name)}"><button type="button" class="secondary" onclick="lookupMedicine()">搜尋圖片</button></div><div class="row" style="margin-top:10px;flex-wrap:wrap;justify-content:flex-start"><button type="button" class="secondary" onclick="lookupTaiwanMedicine()">搜尋台灣藥品資料</button></div><p class="muted">圖片與台灣藥品資料搜尋會在新分頁開啟；「搜尋台灣藥品資料」使用一般網頁搜尋查找台灣藥品資料，並非 App 直接讀取官方資料庫。請以藥袋、許可證字號、劑型及含量核對。若要儲存照片，請使用下方「藥物照片」上傳自己拍攝或有權使用的圖片。</p></div><div class="full"><label>藥品許可證字號（選填）</label><input name="license" value="${safe(m.license||'')}"></div><div class="full"><label>資料來源網址（選填）</label><input name="source" type="url" placeholder="https://..." value="${safe(m.source||'')}"></div><div class="full"><label>用途及備註</label><textarea name="info">${safe(m.info)}</textarea></div><div><label>服用類型</label><select name="type"><option value="fixed" ${m.type==='fixed'?'selected':''}>固定服用</option><option value="prn" ${m.type==='prn'?'selected':''}>需要時服用</option></select></div><div><label>庫存／服用單位</label><input name="unit" value="${safe(m.unit)}"></div><div><label>預設購買單位</label><input name="buyUnit" value="${safe(m.buyUnit||'盒')}"></div><div><label>預設購買數量</label><input name="buyQty" type="number" step="any" min="0.001" value="${m.buyQty||1}"></div><div><label>每包裝含量（選填）</label><input name="packSize" type="number" step="any" min="0" value="${m.packSize||''}"></div><div><label>每次服用量</label><input type="number" step="any" min="0.001" name="dose" value="${m.dose}"></div><div><label>每日預計使用量</label><input type="number" step="any" min="0" name="daily" value="${m.daily}"></div><div class="full"><label>固定服藥時間（多個以半形逗號分隔，例如 08:00,20:00）</label><input name="times" value="${safe(m.times||'')}"></div><div><label>目前庫存</label><input type="number" min="0" step="any" name="stock" value="${m.stock}"></div><div><label>庫存提醒數量</label><input type="number" min="0" name="threshold" value="${m.threshold}"></div><div><label>剩餘天數提醒（0 表示停用）</label><input type="number" min="0" name="days" value="${m.days}"></div><div class="full"><label>藥物照片</label><input type="file" id="photoInput" accept="image/*"><p class="muted">圖片會儲存在此瀏覽器，建議使用小尺寸照片。</p></div></div><div class="row"><button type="submit">儲存藥物</button>${id?`<button type="button" class="danger" onclick="deleteMed('${id}')">刪除藥物</button>`:''}<button type="button" class="secondary" onclick="render()">取消</button></div></form>`;$('medform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let v={id:id||crypto.randomUUID(),person:person(),name:f.get('name').trim(),info:f.get('info'),license:f.get('license'),source:f.get('source').trim(),type:f.get('type'),unit:f.get('unit')||'顆',buyUnit:f.get('buyUnit')||'盒',buyQty:Number(f.get('buyQty'))||1,packSize:Number(f.get('packSize'))||0,active:m.active!==false,dose:Number(f.get('dose')),daily:Number(f.get('daily')),times:f.get('times'),stock:Number(f.get('stock')),threshold:Number(f.get('threshold')),days:Number(f.get('days')),photo:m.photo};if(!Number.isFinite(v.dose)||v.dose<=0||!Number.isFinite(v.daily)||v.daily<0||!Number.isFinite(v.stock)||v.stock<0||!Number.isSafeInteger(v.threshold)||v.threshold<0||!Number.isSafeInteger(v.days)||v.days<0){alert('請輸入有效數值；服用量可以是整數或小數，提醒天數須為整數。');return;}let file=$('photoInput').files[0];if(file){v.photo=await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}if(id)db.meds[db.meds.findIndex(x=>x.id===id)]=v;else db.meds.push(v);try{save()}catch{alert('儲存失敗，可能是照片太大，請改用較小的照片。')}}}
function lookupMedicine(){let q=$('lookupTerm').value.trim();if(!q)return alert('請輸入藥物名稱。');window.open('https://www.google.com/search?tbm=isch&q='+encodeURIComponent(q+' 藥物 外觀'),'_blank','noopener,noreferrer')}
function lookupTaiwanMedicine(){let q=$('lookupTerm').value.trim();if(!q)return alert('請輸入藥物名稱。');window.open('https://www.google.com/search?q='+encodeURIComponent(q+' 台灣 藥品 資料 許可證'),'_blank','noopener,noreferrer')}

function exportData(){const data=JSON.stringify({format:'medication-journal',version:4,families:db.families,restocks:db.restocks,reminders:db.reminders,reminderTimes:db.reminderTimes,exportedAt:new Date().toISOString(),meds:db.meds,logs:db.logs},null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='藥物使用紀錄_備份_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
async function importData(event){const file=event.target.files?.[0];if(!file)return;try{if(file.size>12*1024*1024)throw Error('備份檔過大');const v=JSON.parse(await file.text());if(v.format!=='medication-journal'||!Array.isArray(v.meds)||!Array.isArray(v.logs))throw Error('備份格式不正確');if(v.meds.some(m=>typeof m.id!=='string'||typeof m.person!=='string'||typeof m.name!=='string'||!Number.isFinite(m.stock))||v.logs.some(l=>typeof l.id!=='string'||typeof l.medId!=='string'||!Number.isFinite(l.qty)))throw Error('備份資料格式不正確');if(!confirm('還原將覆蓋目前所有藥物與服藥紀錄。確定繼續？'))return;const old=db;db={meds:v.meds,logs:v.logs,families:Array.isArray(v.families)?v.families:[...new Set(v.meds.map(m=>m.person).filter(x=>x!=='自己'))],restocks:Array.isArray(v.restocks)?v.restocks:[],reminders:v.reminders&&typeof v.reminders==='object'&&!Array.isArray(v.reminders)?v.reminders:{},reminderTimes:v.reminderTimes&&typeof v.reminderTimes==='object'&&!Array.isArray(v.reminderTimes)?v.reminderTimes:{}};refreshPeople();try{save();alert('備份還原完成。')}catch(e){db=old;alert('儲存失敗，原資料未變更。')}}catch(e){alert('無法還原：'+e.message)}finally{event.target.value=''}}
function deleteMed(id){if(confirm('刪除此藥物？過去的服藥紀錄也會刪除。')){db.meds=db.meds.filter(m=>m.id!==id);db.logs=db.logs.filter(l=>l.medId!==id);save()}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('person').onchange=render;refreshPeople();render();
</script></body></html>
