<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#84917a"><link rel="manifest" href="manifest.webmanifest"><title>藥物使用紀錄</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#354238;background:#faf8f2}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:22px 18px 95px}h1{font-size:25px;margin:8px 0 20px}h2{font-size:19px}header small{color:#75806f}.card{background:white;border:1px solid #e6e8df;border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 3px 12px #65735b0d}button,select,input,textarea{font:inherit}button{border:0;border-radius:12px;padding:10px 14px;background:#819178;color:white;cursor:pointer}button.secondary{background:#e9eee5;color:#455642}button.danger{background:#f5e6e1;color:#9a4b40}input,select,textarea{border:1px solid #d5dcd1;border-radius:10px;padding:10px;background:white;max-width:100%;width:100%}label{display:block;margin:12px 0 5px;font-size:14px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e4e8df;display:flex;justify-content:center;gap:5px;padding:9px 4px env(safe-area-inset-bottom)}nav button{font-size:13px;flex:1;max-width:155px;background:transparent;color:#6c7868;padding:10px 4px}nav button.active{background:#e9eee5;color:#3c573d}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.muted{color:#798476;font-size:13px}.pill{border-radius:50px;background:#eef1e9;padding:5px 9px;font-size:12px}.warn{color:#a15a31}.photo{width:64px;height:64px;object-fit:cover;border-radius:12px;background:#e9eee5}.medrow{display:flex;gap:12px;align-items:center}.medrow>div{flex:1}.hidden{display:none}form{margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}p{line-height:1.6}</style></head><body><main><header><small>PERSONAL MEDICATION JOURNAL</small><h1>藥物使用紀錄</h1><label for="person">目前查看</label><select id="person"><option value="自己">自己</option><option value="媽媽">媽媽</option></select></header><section id="content"></section><section class="card"><h2>資料備份</h2><p class="muted">下載 JSON 備份檔，保存自己與媽媽的藥物及服藥紀錄。檔案含個人健康資料，請妥善保管。</p><div class="row"><button class="secondary" onclick="exportData()">下載備份</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">還原備份</button></div><input class="hidden" type="file" id="restoreFile" accept=".json,application/json" onchange="importData(event)"></section></main><nav><button data-tab="today" class="active">今日用藥</button><button data-tab="meds">我的藥物</button><button data-tab="stock">庫存管理</button><button data-tab="history">歷史紀錄</button></nav><script>
const KEY='medication-journal-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{meds:[],logs:[]}}catch{db={meds:[],logs:[]}}let tab='today';const $=id=>document.getElementById(id),person=()=> $('person').value;const today=()=>new Date().toLocaleDateString('sv-SE');const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()};const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const meds=()=>db.meds.filter(m=>m.person===person());const low=m=>m.stock<=m.threshold||(m.type==='fixed'&&m.daily>0&&m.days>0&&m.stock/m.daily<=m.days);const pic=m=>m.photo?`<img class="photo" src="${m.photo}" alt="藥物照片">`:'<span class="photo" style="display:grid;place-items:center">💊</span>';
function lineMessage(m){
 return `藥物庫存提醒\n使用者：${m.person}\n藥物：${m.name}`;
}
async function imageFile(m){
 if(!m.photo)return null;
 const response=await fetch(m.photo);
 const blob=await response.blob();
 const type=blob.type||'image/png';
 const ext=type.includes('jpeg')?'jpg':type.includes('webp')?'webp':'png';
 return new File([blob],`藥物照片.${ext}`,{type});
}
function shareText(m){
 window.open('https://line.me/R/msg/text/?'+encodeURIComponent(lineMessage(m)),'_blank','noopener,noreferrer');
}
async function shareLine(id){
 const m=db.meds.find(x=>x.id===id);
 if(!m)return alert('找不到藥物。');
 if(m.photo&&navigator.share){
  try{
   const file=await imageFile(m);
   if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    await navigator.share({text:lineMessage(m),files:[file]});
    return;
   }
  }catch(e){
   if(e.name==='AbortError')return;
  }
 }
 shareText(m);
 if(m.photo)alert('目前僅開啟文字分享。若要附上藥物圖片，請從藥物資料卡下載照片，再於 LINE 手動附加。');
}
function downloadMedPhoto(id){
 const m=db.meds.find(x=>x.id===id);
 if(!m?.photo)return alert('這筆藥物尚未上傳照片。');
 const a=document.createElement('a');
 a.href=m.photo;a.download='藥物照片.png';document.body.appendChild(a);a.click();a.remove();
}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let out='';if(tab==='today'){out=`<h2>今日用藥 <span class="muted">${today()}</span></h2>`;let fixed=meds().filter(m=>m.type==='fixed');out+=fixed.length?'':'<div class="card">尚未建立固定服用的藥物，請到「我的藥物」新增。</div>';for(const m of fixed){let times=(m.times||'').split(',').map(x=>x.trim()).filter(Boolean);for(const t of times){let done=db.logs.some(l=>l.medId===m.id&&l.slot===t&&l.date===today());out+=`<div class="card medrow">${pic(m)}<div><strong>${safe(m.name)}</strong><div class="muted">${safe(t)} · ${m.dose} ${safe(m.unit)}</div></div><button class="${done?'secondary':''}" onclick="toggleDose('${m.id}','${safe(t)}')">${done?'✓ 已服用':'已服用'}</button></div>`}}out+='<h2>需要時服用</h2>';let prn=meds().filter(m=>m.type==='prn');out+=prn.length?'':'<div class="card">尚未建立需要時服用的藥物。</div>';for(const m of prn)out+=`<div class="card medrow">${pic(m)}<div><strong>${safe(m.name)}</strong><div class="muted">庫存 ${m.stock} ${safe(m.unit)}</div></div><button onclick="takePrn('${m.id}')">記錄服用</button></div>`}
if(tab==='meds'){out='<h2>我的藥物</h2><button onclick="showForm()">＋ 新增藥物</button><div id="editor"></div>';for(const m of meds())out+=`<div class="card medrow">${pic(m)}<div><strong>${safe(m.name)}</strong><div class="muted">${safe(m.info||'尚未填寫用途')} · ${m.type==='fixed'?'固定服用':'需要時服用'}</div><div class="muted">庫存 ${m.stock} ${safe(m.unit)}</div></div><button class="secondary" onclick="showForm('${m.id}')">編輯</button></div>`}
if(tab==='stock'){out='<h2>庫存管理</h2>';for(const m of meds())out+=`<div class="card"><div class="row"><strong>${safe(m.name)}</strong><span class="${low(m)?'warn':'muted'}">${low(m)?'庫存提醒':'庫存正常'}</span></div><p>剩餘 <b>${m.stock}</b> ${safe(m.unit)}${m.type==='fixed'&&m.daily>0?` · 約 ${Math.floor(m.stock/m.daily)} 天`:''}</p><div class="row"><button class="secondary" onclick="restock('${m.id}')">＋ 補充庫存</button><button class="secondary" onclick="shareLine('${m.id}')">LINE 傳送提醒</button>${m.photo?`<button class="secondary" onclick="downloadMedPhoto('${m.id}')">儲存藥物圖片</button>`:''}<span class="muted">提醒量：${m.threshold}</span></div></div>`;if(!meds().length)out+='<div class="card">目前沒有藥物。</div>';out+='<p class="muted">點選「LINE 傳送提醒」可分享藥物名稱與使用者；若裝置支援，可一併分享照片。部分 LINE 版本可能無法同時帶入文字及照片，請送出前確認。</p>'}
if(tab==='history'){out='<h2>服藥歷史</h2>';let ids=new Set(meds().map(m=>m.id));let logs=db.logs.filter(l=>ids.has(l.medId)).sort((a,b)=>b.at.localeCompare(a.at));for(const l of logs){let m=db.meds.find(m=>m.id===l.medId);out+=`<div class="card row"><div><strong>${safe(m?.name||'已刪除藥物')}</strong><div class="muted">${safe(l.at.replace('T',' '))} · ${l.qty} ${safe(m?.unit||'')}</div></div><button class="secondary" onclick="undo('${l.id}')">撤銷</button></div>`}if(!logs.length)out+='<div class="card">尚無服藥紀錄。</div>'} $('content').innerHTML=out}
function addLog(m,qty,slot=''){if(!Number.isFinite(qty)||qty<=0)return alert('服用量必須大於 0，可以輸入整數或小數。');if(m.stock<qty)return alert('庫存不足，請先補充庫存。');m.stock=+(m.stock-qty).toFixed(4);db.logs.push({id:crypto.randomUUID(),medId:m.id,qty,slot,date:today(),at:new Date().toLocaleString('sv-SE').replace(' ','T')});save();if(low(m))alert(`${m.name} 已達庫存提醒條件。`)}
function undo(id){let i=db.logs.findIndex(l=>l.id===id);if(i<0)return;let l=db.logs[i],m=db.meds.find(m=>m.id===l.medId);if(m)m.stock=+(m.stock+l.qty).toFixed(4);db.logs.splice(i,1);save()}
function toggleDose(id,slot){let m=db.meds.find(x=>x.id===id);let l=db.logs.find(x=>x.medId===id&&x.slot===slot&&x.date===today());if(l){if(confirm('取消這次服藥紀錄並恢復庫存？'))undo(l.id)}else addLog(m,m.dose,slot)}
function takePrn(id){let m=db.meds.find(x=>x.id===id);let q=Number(prompt(`本次服用 ${m.name} 幾${m.unit}？`,m.dose));if(Number.isFinite(q)&&q>0)addLog(m,q)}
function restock(id){let m=db.meds.find(x=>x.id===id),q=Number(prompt(`要補充多少 ${m.unit}？`,'10'));if(Number.isFinite(q)&&q>0){m.stock=+(m.stock+q).toFixed(4);save()}}
function showForm(id){let m=db.meds.find(x=>x.id===id)||{name:'',info:'',type:'fixed',unit:'顆',dose:1,daily:1,stock:0,threshold:10,days:7,times:'08:00',photo:''};$('editor').innerHTML=`<form class="card" id="medform"><h2>${id?'編輯藥物':'新增藥物'}</h2><div class="grid"><div class="full"><label>藥物名稱</label><input name="name" required value="${safe(m.name)}"></div><div class="full"><label>搜尋藥物圖片</label><div class="row"><input id="lookupTerm" placeholder="輸入藥物名稱或外觀特徵" value="${safe(m.name)}"><button type="button" class="secondary" onclick="lookupMedicine()">搜尋圖片</button></div><div class="row" style="margin-top:10px;flex-wrap:wrap;justify-content:flex-start"><button type="button" class="secondary" onclick="lookupTaiwanMedicine()">搜尋台灣藥品資料</button></div><p class="muted">圖片與台灣藥品資料搜尋會在新分頁開啟；「搜尋台灣藥品資料」使用一般網頁搜尋查找台灣藥品資料，並非 App 直接讀取官方資料庫。請以藥袋、許可證字號、劑型及含量核對。若要儲存照片，請使用下方「藥物照片」上傳自己拍攝或有權使用的圖片。</p></div><div class="full"><label>藥品許可證字號（選填）</label><input name="license" value="${safe(m.license||'')}"></div><div class="full"><label>資料來源網址（選填）</label><input name="source" type="url" placeholder="https://..." value="${safe(m.source||'')}"></div><div class="full"><label>用途及備註</label><textarea name="info">${safe(m.info)}</textarea></div><div><label>服用類型</label><select name="type"><option value="fixed" ${m.type==='fixed'?'selected':''}>固定服用</option><option value="prn" ${m.type==='prn'?'selected':''}>需要時服用</option></select></div><div><label>單位</label><input name="unit" value="${safe(m.unit)}"></div><div><label>每次服用量</label><input type="number" step="any" min="0.001" name="dose" value="${m.dose}"></div><div><label>每日預計使用量</label><input type="number" step="any" min="0" name="daily" value="${m.daily}"></div><div class="full"><label>固定服藥時間（多個以半形逗號分隔，例如 08:00,20:00）</label><input name="times" value="${safe(m.times||'')}"></div><div><label>目前庫存</label><input type="number" min="0" step="any" name="stock" value="${m.stock}"></div><div><label>庫存提醒數量</label><input type="number" min="0" name="threshold" value="${m.threshold}"></div><div><label>剩餘天數提醒（0 表示停用）</label><input type="number" min="0" name="days" value="${m.days}"></div><div class="full"><label>藥物照片</label><input type="file" id="photoInput" accept="image/*"><p class="muted">圖片會儲存在此瀏覽器，建議使用小尺寸照片。</p></div></div><div class="row"><button type="submit">儲存藥物</button>${id?`<button type="button" class="danger" onclick="deleteMed('${id}')">刪除藥物</button>`:''}<button type="button" class="secondary" onclick="render()">取消</button></div></form>`;$('medform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let v={id:id||crypto.randomUUID(),person:person(),name:f.get('name').trim(),info:f.get('info'),license:f.get('license'),source:f.get('source').trim(),type:f.get('type'),unit:f.get('unit')||'顆',dose:Number(f.get('dose')),daily:Number(f.get('daily')),times:f.get('times'),stock:Number(f.get('stock')),threshold:Number(f.get('threshold')),days:Number(f.get('days')),photo:m.photo};if(!Number.isFinite(v.dose)||v.dose<=0||!Number.isFinite(v.daily)||v.daily<0||!Number.isFinite(v.stock)||v.stock<0||!Number.isSafeInteger(v.threshold)||v.threshold<0||!Number.isSafeInteger(v.days)||v.days<0){alert('請輸入有效數值；服用量可以是整數或小數，提醒天數須為整數。');return;}let file=$('photoInput').files[0];if(file){v.photo=await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}if(id)db.meds[db.meds.findIndex(x=>x.id===id)]=v;else db.meds.push(v);try{save()}catch{alert('儲存失敗，可能是照片太大，請改用較小的照片。')}}}
function lookupMedicine(){let q=$('lookupTerm').value.trim();if(!q)return alert('請輸入藥物名稱。');window.open('https://www.google.com/search?tbm=isch&q='+encodeURIComponent(q+' 藥物 外觀'),'_blank','noopener,noreferrer')}
function lookupTaiwanMedicine(){let q=$('lookupTerm').value.trim();if(!q)return alert('請輸入藥物名稱。');window.open('https://www.google.com/search?q='+encodeURIComponent(q+' 台灣 藥品 資料 許可證'),'_blank','noopener,noreferrer')}

function exportData(){const data=JSON.stringify({format:'medication-journal',version:1,exportedAt:new Date().toISOString(),meds:db.meds,logs:db.logs},null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='藥物使用紀錄_備份_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
async function importData(event){const file=event.target.files?.[0];if(!file)return;try{if(file.size>12*1024*1024)throw Error('備份檔過大');const v=JSON.parse(await file.text());if(v.format!=='medication-journal'||!Array.isArray(v.meds)||!Array.isArray(v.logs))throw Error('備份格式不正確');if(v.meds.some(m=>typeof m.id!=='string'||typeof m.person!=='string'||typeof m.name!=='string'||!Number.isFinite(m.stock))||v.logs.some(l=>typeof l.id!=='string'||typeof l.medId!=='string'||!Number.isFinite(l.qty)))throw Error('備份資料格式不正確');if(!confirm('還原將覆蓋目前所有藥物與服藥紀錄。確定繼續？'))return;const old=db;db={meds:v.meds,logs:v.logs};try{save();alert('備份還原完成。')}catch(e){db=old;alert('儲存失敗，原資料未變更。')}}catch(e){alert('無法還原：'+e.message)}finally{event.target.value=''}}
function deleteMed(id){if(confirm('刪除此藥物？過去的服藥紀錄也會刪除。')){db.meds=db.meds.filter(m=>m.id!==id);db.logs=db.logs.filter(l=>l.medId!==id);save()}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('person').onchange=render;render();
</script></body></html>
