 });

function cardMedHTML(summary){const list=cardMeds(),items=summary?list.slice(0,3):list;return items.map(m=>`<div class="card"><strong>${safe(m.name)}</strong>${m.active===false?' <span class="pill medical-orange">已停用</span>':''}<div class="muted">${safe(cardDose(m))}</div></div>`).join('')+(summary&&list.length>3?`<p class="muted">另有 ${list.length-3} 筆，查看完整資料</p>`:'')||'<p class="muted">尚未選擇帶入醫療卡的藥物</p>'}
function cardDates(c){return `<div class="medical-mini">資料提供日期：${safe(c.providedDate||'未提供')}<br>最後修改日期：${safe(c.modifiedDate||'未提供')}</div>`}
function cardNoticeHTML(){const n=cardNotice;cardNotice='';return n?`<div class="subtle" role="status">${safe(n)}</div>`:''}
function medicalCardPanel(){if(storageRecoveryMode)return '<div class="card">資料保護模式，無法操作醫療卡。</div>';const c=cardCurrent();let out='<div class="medical-card-wrap">'+cardNoticeHTML();
 if(cardView==='edit')return out+cardEditPanel(c)+'</div>';
 if(cardView==='share')return out+cardSharePanel()+'</div>';
 if(!c)return out+`<div class="card" style="text-align:center"><h2>尚未建立醫療卡</h2><p class="muted">可建立個人醫療資料卡，手動欄位均為選填。</p><button onclick="cardStartEdit()">建立醫療卡</button></div></div>`;
 if(cardView==='preview')return out+`<div class="row"><h2>醫療卡預覽</h2><button class="secondary" onclick="cardGo('summary')">關閉</button></div>${cardSharePreviewHTML(cardShareData(['basic','medical','allergy','meds']))}<button class="secondary medical-fixed" onclick="cardGo('summary')">返回醫療卡</button></div>`;
 if(cardView==='summary'){

 return out+`<div class="card"><div class="row"><h2>個人醫療資料卡</h2><div class="medical-home-actions"><button class="secondary" onclick="cardStartEdit()">編輯</button><button onclick="cardGo('preview')">${cardIcon('eye')}預覽</button></div></div><h3>${safe(cardName(c))}</h3><p>血型：${cardValue(c.blood)}<br>出生日期：${cardValue(c.dob)}</p>${missing?'<div class="subtle">部分手動填寫欄位尚未提供，可透過「編輯醫療卡」補充。</div>':''}<h3>藥物過敏史</h3>${cardAllergyHTML()}<h3>緊急聯絡人</h3>${cardContacts(c)}<h3>慢性疾病與重要病史</h3>${cardText('chronic',c.chronic)}${cardText('history',c.history)}<h3>目前用藥</h3>${cardMedHTML(true)}${cardDates(c)}<button class="medical-fixed" onclick="cardGo('full')">查看完整資料</button></div></div>`;
 }
 return out+`<div class="row"><button class="secondary" onclick="cardGo('summary')">← 返回</button><button class="secondary" onclick="cardStartEdit()">編輯</button></div><h2>完整醫療卡：${safe(cardName(c))}</h2><div class="card"><h3>基本資料</h3><p>姓名：${safe(cardName(c))}<br>出生日期：${cardValue(c.dob)}<br>血型：${cardValue(c.blood)}</p></div><div class="card"><h3>醫療資訊</h3><p>慢性疾病：${cardValue(c.chronic)}</p><p>重要病史：${cardValue(c.history)}</p><p>醫療備註：${cardValue(c.notes)}</p><h3>緊急聯絡人</h3>${cardContacts(c)}</div><div class="card"><h3>藥物過敏史</h3>${cardAllergyHTML()}</div><div class="card"><h3>目前用藥</h3>${cardMedHTML(false)}</div>${cardDates(c)}<button class="medical-fixed" onclick="cardShareStart()">分享醫療卡</button></div>`;

function cardStartEdit(){cardDraft=JSON.parse(JSON.stringify(cardCurrent()||cardEmpty()));if(!cardDraft.name)cardDraft.name=person();cardEditingPerson=person();cardEditDirty=false;cardView='edit';render()}
function cardDraftInput(el){if(!cardDraft)return;const key=el.dataset.key;if(key==='contactName'||key==='contactPhone'){const i=Number(el.dataset.i);cardDraft.contacts[i][key==='contactName'?'name':'phone']=el.value}else cardDraft[key]=el.value;cardEditDirty=true}
function cardEditPanel(c){const d=cardDraft||cardEmpty();const contact=(x,i)=>`<div class="card"><strong>緊急聯絡人 ${i+1}</strong><label>姓名（選填）</label><input data-key="contactName" data-i="${i}" value="${safe(x.name)}" oninput="cardDraftInput(this)"><label>電話（選填）</label><input type="tel" data-key="contactPhone" data-i="${i}" value="${safe(x.phone)}" oninput="cardDraftInput(this)"></div>`;
 return `<div class="row"><h2>編輯醫療卡</h2><button class="secondary" onclick="cardEditMore()">清除手動資料</button></div><p class="muted">所有欄位皆為選填。未儲存的修改不會自動保留。</p><details open><summary>基本資料</summary><label>姓名（選填）</label><input data-key="name" maxlength="299" value="${safe(d.name||person())}" oninput="cardDraftInput(this)"><label>出生日期（選填）</label><input type="date" max="${today()}" data-key="dob" value="${safe(d.dob)}" oninput="cardDraftInput(this)"><label>血型（選填）</label><select data-key="blood" onchange="cardDraftInput(this)">${['','A','B','AB','O','不確定'].map(x=>`<option value="${x}" ${x===d.blood?'selected':''}>${x||'未提供'}</option>`).join('')}</select></details><details><summary>醫療資訊</summary>${[['chronic','慢性疾病'],['history','重要病史'],['notes','醫療備註']].map(([k,t])=>`<label>${t}（選填）</label><textarea rows="3" data-key="${k}" oninput="cardDraftInput(this)">${safe(d[k])}</textarea>`).join('')}</details><details><summary>緊急聯絡人</summary>${d.contacts.map(contact).join('')}${d.contacts.length<2?'<button class="secondary" onclick="cardAddContact()">＋ 新增第二位聯絡人</button>':''}</details><details><summary>藥物與過敏史來源</summary><p class="muted">藥物請在「我的藥物」勾選帶入醫療卡；過敏史請在「藥物過敏史」編輯。此處只顯示原始資料，不另外複製。</p></details><div class="medical-save"><button class="medical-fixed" onclick="cardSave()">儲存醫療卡</button><button class="secondary" onclick="cardGo('${c?'full':'summary'}')">取消</button></div>`}
function cardAddContact(){if(!cardDraft||cardDraft.contacts.length>=2)return;cardDraft.contacts.push({name:'',phone:''});cardEditDirty=true;render()}
function cardEditMore(){if(!cardCurrent())return alert('尚未建立醫療卡。');if(!confirm('要清空目前使用者手動填寫的醫療卡資料嗎？藥物、過敏史及帶入設定不會刪除。'))return;if(cardEditDirty&&!confirm('目前尚有未儲存修改，確定放棄並清空已儲存的手動欄位？'))return;
 const current=cardCurrent(),next={...cardEmpty(),name:person(),created:true,providedDate:current.providedDate,modifiedDate:today()};const old=db.medicalCards[person()];db.medicalCards[person()]=next;if(cardPersist()){cardDraft=null;cardEditDirty=false;cardView='summary';cardNotice='醫療卡手動資料已清空';render()}else if(!storageRecoveryMode)db.medicalCards[person()]=old;
}
function cardPersist(){pendingRestore=null;if(storageRecoveryMode)return false;try{const payload=JSON.stringify(db);localStorage.setItem(KEY,payload);if(localStorage.getItem(KEY)!==payload)throw Error('寫入驗證失敗');const read=JSON.parse(localStorage.getItem(KEY));if(JSON.stringify(read.medicalCards)!==JSON.stringify(db.medicalCards))throw Error('醫療卡讀回驗證失敗');return true}catch(e){try{const persisted=JSON.parse(localStorage.getItem(KEY));if(!persisted||!persisted.medicalCards)throw Error('無法確認寫入');db=persisted;storageRecoveryMode=true}catch(_){storageRecoveryMode=true}alert('醫療卡尚未確認儲存成功，請保留畫面資料。'+e.message+(storageRecoveryMode?'目前已停止寫入。':''));return false}}
function cardSave(){if(!cardDraft||person()!==cardEditingPerson)return alert('使用者已變更，停止儲存');if(!validCard(cardDraft))return alert('請檢查出生日期、血型及聯絡人欄位。');const old=cardCurrent(),draft=JSON.parse(JSON.stringify(cardDraft));draft.providedDate=old?.providedDate||today();draft.modifiedDate=today();db.medicalCards[person()]=draft;if(cardPersist()){cardEditDirty=false;cardDraft=null;cardView=old?'full':'summary';cardNotice='醫療卡已儲存';render()}else{if(!storageRecoveryMode)db.medicalCards[person()]=old;cardDraft=draft}}
function cardShareStart(){cardShareSelections={basic:false,medical:false,allergy:false,meds:false};cardShareSnapshot=null;cardShareStep='select';cardView='share';render()}
function cardShareToggle(k,v){cardShareSelections[k]=v;cardShareSnapshot=null}
function cardShareData(allSections){const c=cardCurrent();if(!c||!validCard(c))throw Error('醫療卡資料驗證失敗');const selected=allSections||Object.keys(cardShareSelections||{}).filter(k=>cardShareSelections[k]);if(!selected.length)throw Error('請至少選擇一個資料區塊');return {person:person(),c:JSON.parse(JSON.stringify(c)),a:JSON.parse(JSON.stringify(cardAllergies())),m:JSON.parse(JSON.stringify(cardMeds())),selected}}
function cardShareLines(d){const s=d.selected,l=['個人醫療資料卡'];if(s.includes('basic'))l.push('【基本資料】','姓名：'+(d.c.name||d.person),'出生日期：'+(d.c.dob||'未提供'),'血型：'+(d.c.blood||'未提供'));if(s.includes('medical'))l.push('【醫療資訊】','慢性疾病：'+(d.c.chronic||'未提供'),'重要病史：'+(d.c.history||'未提供'),'醫療備註：'+(d.c.notes||'未提供'),...d.c.contacts.filter(x=>x.name||x.phone).map((x,i)=>`緊急聯絡人 ${i+1}：${x.name||'未提供'}　${x.phone||'未提供'}`));if(s.includes('allergy'))l.push('【藥物過敏史】',...(d.a.length?d.a.map(x=>`${x.name||'藥名未提供'}｜${x.status||'狀態未提供'}｜成分：${x.ingredient||'未提供'}｜反應/症狀：${x.note||'未提供'}${x.status==='疑似反應'&&x.reminderContent?'｜提醒：'+x.reminderContent:''}`):['尚未建立藥物過敏史紀錄']));if(s.includes('meds'))l.push('【目前用藥】',...(d.m.length?d.m.map(x=>`${x.name}｜${cardDose(x)}${x.active===false?'｜已停用':''}`):['尚未選擇帶入醫療卡的藥物']));l.push('資料提供日期：'+(d.c.providedDate||'未提供'),'最後修改日期：'+(d.c.modifiedDate||'未提供'));return l.join('\n')}
function cardIcon(k){const paths={"briefcase": "<rect x=\"3\" y=\"7\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M12 10v8m-4-4h8\"/>", "heart": "<path d=\"M20.8 8.6c0 4.3-8.8 9.9-8.8 9.9S3.2 12.9 3.2 8.6A4.6 4.6 0 0 1 12 6.7a4.6 4.6 0 0 1 8.8 1.9Z\"/><path d=\"M3 11h5l2-4 3 7 2-3h6\"/>", "contact": "<rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"3\"/><circle cx=\"9\" cy=\"10\" r=\"2\"/><path d=\"M5.5 16c0-4 7-4 7 0M15 9h3m-3 4h3\"/>", "medical": "<rect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"2\"/><rect x=\"9\" y=\"2\" width=\"6\" height=\"4\" rx=\"1\" fill=\"#E8EDE3\"/><path d=\"M12 9v8m-4-4h8\"/>", "shield": "<path d=\"M12 2 4 5v6c0 5 4 8 8 11 4-3 8-6 8-11V5Z\"/><path d=\"M12 7v6m0 4h.01\"/>", "pill": "<path d=\"M5 19a5 5 0 0 1 0-7L12 5a5 5 0 0 1 7 7l-7 7a5 5 0 0 1-7 0ZM8.5 8.5l7 7\"/>", "eye": "<path d=\"M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/>"};return `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[k]||''}</svg>`}
function cardPreviewSection(icon,title,rows){return `<section class="medical-preview-section"><h4><span class="medical-preview-icon" aria-hidden="true">${cardIcon(icon)}</span>${title}</h4>${rows.map(r=>`<p>${icon==='pill'&&r.endsWith('｜已停用')?safe(r.slice(0,-4))+' <span class="pill medical-orange">已停用</span>':safe(r)}</p>`).join('')}</section>`}
function cardSharePreviewHTML(d){const selected=d.selected,c=d.c;let html=`<div class="medical-share-preview"><h3><span class="medical-preview-icon medical-title-icon">${cardIcon('briefcase')}</span>個人醫療資料卡</h3>`;
 if(selected.includes('basic'))html+=cardPreviewSection('contact','基本資料',[`姓名：${c.name||d.person}　血型：${c.blood||'未提供'}`,`出生日期：${c.dob||'未提供'}`]);
 if(selected.includes('medical'))html+=cardPreviewSection('medical','醫療資訊',[`慢性疾病：${c.chronic||'未提供'}`,`重要病史：${c.history||'未提供'}`,`醫療備註：${c.notes||'未提供'}`,...c.contacts.filter(x=>x.name||x.phone).map((x,i)=>`緊急聯絡人 ${i+1}：${x.name||'未提供'}　${x.phone||'未提供'}`)]);
 if(selected.includes('allergy'))html+=cardPreviewSection('shield','藥物過敏史',d.a.length?d.a.map(x=>`${x.name||'藥名未提供'}｜${x.status||'狀態未提供'}｜成分：${x.ingredient||'未提供'}｜反應/症狀：${x.note||'未提供'}${x.status==='疑似反應'&&x.reminderContent?'｜提醒：'+x.reminderContent:''}`):['尚未建立藥物過敏史紀錄']);
 if(selected.includes('meds'))html+=cardPreviewSection('pill','目前用藥',d.m.length?d.m.map(x=>`${x.name}｜${cardDose(x)}${x.active===false?'｜已停用':''}`):['尚未選擇帶入醫療卡的藥物']);
 return html+`<div class="medical-preview-dates">資料提供：${safe(c.providedDate||'未提供')}　最後修改：${safe(c.modifiedDate||'未提供')}</div></div>`}
function cardSharePreview(){try{cardShareSnapshot=cardShareData();cardShareStep='preview';render()}catch(e){alert(e.message)}}
function cardShareVerify(){if(!cardShareSnapshot)return false;try{return JSON.stringify(cardShareData())===JSON.stringify(cardShareSnapshot)}catch(e){return false}}
function cardShareMode(mode){if(!cardShareVerify()){cardShareStep='select';cardShareSnapshot=null;cardNotice='來源資料已有變更，請重新產生預覽';render();return}cardShareStep='confirm';cardShareOutput=mode;render()}
let cardShareOutput='PDF';
function cardSharePanel(){const labels={basic:'基本資料',medical:'醫療資訊',allergy:'藥物過敏史',meds:'目前用藥'};let out='<div class="row"><h2>分享醫療卡</h2><button class="secondary" onclick="cardShareExit()">取消</button></div>';
 if(cardShareStep==='select')return out+Object.entries(labels).map(([k,v])=>`<label class="medical-choice"><span>${v}</span><input type="checkbox" ${cardShareSelections?.[k]?'checked':''} onchange="cardShareToggle('${k}',this.checked)"></label>`).join('')+'<button class="medical-fixed" onclick="cardSharePreview()">預覽選取內容</button>';
 if(cardShareStep==='preview')return out+`<h3>分享內容預覽</h3>${cardSharePreviewHTML(cardShareSnapshot)}<div class="medical-preview-actions"><button class="secondary" onclick="cardShareStep='select';render()">返回內容選擇</button><button class="medical-fixed" onclick="cardShareStep='method';render()">確認內容並繼續</button></div>`;
 if(cardShareStep==='method')return out+`<button class="secondary" onclick="cardShareStep='preview';render()">返回預覽</button><div class="medical-share-methods"><button class="medical-fixed" onclick="cardShareMode('PDF')">匯出 PDF</button><button class="medical-fixed medical-line-btn" onclick="cardShareMode('LINE')">LINE 分享</button></div>`;
 return out+`<div class="card"><h3>最後確認</h3><p>使用者：${safe(person())}<br>分享方式：${cardShareOutput}<br>已選：${cardShareSnapshot.selected.map(k=>labels[k]).join('、')}</p><p>請確認內容與接收對象。</p></div><button class="secondary" onclick="cardShareStep='method';render()">返回預覽</button><button class="medical-fixed" onclick="cardShareExecute()">確認${cardShareOutput==='PDF'?'匯出':'分享'}</button>`
}
function cardShareExit(){if(!confirm('離開分享流程？本次選擇將不保留。'))return;cardShareSnapshot=null;cardShareSelections=null;cardView='full';render()}
async function cardShareExecute(){if(!cardShareVerify()){cardShareStep='select';cardShareSnapshot=null;cardNotice='預覽已失效，請重新確認最新資料';render();return}const d=cardShareSnapshot,text=cardShareLines(d);
 try{if(cardShareOutput==='PDF'){const w=window.open('','_blank');if(!w)throw Error('無法開啟列印視窗，請允許彈出視窗');w.document.write('<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>個人醫療資料卡</title><style>@page{size:A4 portrait;margin:18mm}body{font:14px/1.7 sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body>'+safe(text)+'</body></html>');w.document.close();w.focus();w.print();alert('已開啟 PDF 列印介面。請自行選擇儲存為 PDF，尚未確認檔案已保存。')}
 else if(navigator.share){await navigator.share({title:'個人醫療資料卡',text})}
 else{window.open('https://line.me/R/msg/text/?'+encodeURIComponent(text),'_blank','noopener,noreferrer');alert('已嘗試開啟 LINE，無法確認訊息是否送出。')}
 }catch(e){if(e.name==='AbortError')return;alert('分享未完成：'+e.message+'。請重新預覽後再試。');cardShareSnapshot=null;cardShareStep='select';render()}

function validateR3Backup(v){const persons=new Set(['自己',...(Array.isArray(v.families)?v.families:v.meds.map(m=>m.person))]);const ids=new Set(),meds=new Map();for(const m of v.meds){if(ids.has(m.id)||!persons.has(m.person))throw Error('藥物 ID 重複或使用者不正確');ids.add(m.id);meds.set(m.id,m)}const slips=Array.isArray(v.prescriptionSlips)?v.prescriptionSlips:[];if(v.prescriptionSlips!==undefined&&!Array.isArray(v.prescriptionSlips))throw Error('領用單資料格式錯誤');const seen=new Set();for(const x of slips){if(!x||typeof x.id!=='string'||!x.id||seen.has(x.id)||!meds.has(x.medId)||meds.get(x.medId).person!==x.person||typeof x.pickupDate!=='string'||!/^\d{4}-\d\d-\d\d$/.test(x.pickupDate)||typeof x.prescriptionDate!=='string'||!/^\d{4}-\d\d-\d\d$/.test(x.prescriptionDate)||!Number.isInteger(x.advanceDays)||x.advanceDays<0||x.advanceDays>365||typeof x.reminderOn!=='boolean'||(x.quantity!==null&&x.quantity!==undefined&&(!validQty(x.quantity)||x.quantity<=0)))throw Error('領用單重複、使用者或藥物對應錯誤，或欄位無效');if(x.pharmacy!==undefined&&(typeof x.pharmacy!=='string'||x.pharmacy.length>150))throw Error('領用藥局格式不正確');seen.add(x.id)}}

 try{if(file.size>12*1024*1024)throw Error('備份檔過大');const raw=await file.text(),v=JSON.parse(raw);medicalBackupValidate(v);const digest=await hashText(raw);
 const details=`版本：${v.version||'舊版'}\n備份日期：${v.exportedAt||'未提供'}\n使用者：${['自己',...(v.families||[])].join('、')}\n藥物：${v.meds.length} 筆；過敏史：${(v.allergies||[]).length} 筆\n醫療卡：${Object.keys(v.medicalCards||{}).length} 位\n\n還原將覆蓋本正式版所有資料。`;
 if(!confirm(details+'\n\n要開始還原前備份驗證嗎？'))return;
 const current=JSON.stringify({format:'medication-journal',version:7,...db,exportedAt:new Date().toISOString()},null,2);const currentHash=await hashText(current);
 pendingRestore={v,digest,currentHash};downloadText(current,'藥物使用紀錄_還原前備份.json');
 alert('已啟動還原前備份下載。請先將檔案儲存至 iPhone「檔案」，再點選「驗證還原前備份」重新選取實際儲存的檔案。未完成驗證前不會覆蓋資料。');
 const b=document.getElementById('verifyRestoreBackup');b.hidden=false;
 }catch(e){pendingRestore=null;alert('無法還原：'+e.message)}
}
async function verifyRestoreBackup(event){const file=event.target.files?.[0];event.target.value='';if(!file||!pendingRestore)return;
 try{const raw=await file.text(),v=JSON.parse(raw);medicalBackupValidate(v);if(await hashText(raw)!==pendingRestore.currentHash)throw Error('重新選取的備份與目前資料不一致');
 if(await hashText(JSON.stringify({format:'medication-journal',version:7,...db,exportedAt:JSON.parse(raw).exportedAt},null,2))!==pendingRestore.currentHash)throw Error('目前資料已異動，請重新開始');
 if(!confirm('已驗證還原前備份。確定覆蓋本正式版的全部資料？'))return;
 const next=restoreObject(pendingRestore.v);const payload=JSON.stringify(next);
 try{localStorage.setItem(KEY,payload);if(localStorage.getItem(KEY)!==payload)throw Error('寫入後驗證失敗');db=next;storageRecoveryMode=false;pendingRestore=null;document.getElementById('verifyRestoreBackup').hidden=true;rxDrafts={};cardShareSnapshot=null;cardView='summary';refreshPeople();render();alert('正式版資料還原完成。')}
 catch(e){storageRecoveryMode=true;alert('還原寫入狀態無法確認，已停止後續寫入。請勿清除網站資料。錯誤：'+e.message)}
 }catch(e){alert('備份驗證未通過：'+e.message)}
}
function downloadText(t,name,type='application/json'){const u=URL.createObjectURL(new Blob([t],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}

function deleteMed(id){if(db.prescriptionSlips.some(x=>x.medId===id))return alert('此藥物仍有未領用單，不能刪除。');if(confirm('刪除此藥物？過去的服藥紀錄也會刪除。'+(db.meds.some(m=>m.id===id&&m.medicalCardIncluded)?'\n此藥物已帶入醫療卡，刪除後醫療卡也不再顯示。':'') )){const m=db.meds.find(x=>x.id===id);if(m)delete db.purchasePrices[priceKey(m)];db.meds=db.meds.filter(m=>m.id!==id);db.logs=db.logs.filter(l=>l.medId!==id);save()}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(medSection==='medicalCard'&&cardView==='edit'&&cardEditDirty&&!cardLeaveEdit())return;if(tab==='stock'&&stockSection==='rx'){rxCapture();rxEditing=null}if(tab==='stock'&&b.dataset.tab!=='stock'&&!stockExit())return;historyExportApproval=null;tab=b.dataset.tab;render()});$('person').onchange=()=>{if(medSection==='medicalCard'&&cardView==='edit'&&cardEditDirty&&!cardLeaveEdit()){$('person').value=lastPerson;return;}cardShareSnapshot=null;cardShareSelections=null;cardShareStep='select';cardView='summary';cardNotice='已切換至目前使用者的醫療卡';if(tab==='stock'&&!stockExit()){$('person').value=lastPerson;return;}if(stockSection==='rx'){rxCapture(lastPerson);rxEditing=null;rxCompletionId=null}lastPerson=person();historyExportApproval=null;render()};refreshPeople();lastPerson=person();
if(storageRecoveryMode){$('content').innerHTML='<div class="card"><h2>資料保護模式</h2><p>系統無法安全讀取原有資料，因此已停止儲存，避免覆蓋資料。請不要清除網站資料或移除 App。若你有先前 JSON 備份，請使用下方「還原備份」；原始資料仍保留在此網站儲存空間中。</p></div>';}
else {cleanupExpiredRestocks();render();}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('離線快取未啟用',e));
</script></body></html>
