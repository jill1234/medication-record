:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#354238;background:#faf8f2}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:22px 18px 95px}h1{font-size:25px;margin:8px 0 20px}h2{font-size:19px}header small{color:#75806f}.card{background:white;border:1px solid #e6e8df;border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 3px 12px #65735b0d}button,select,input,textarea{font:inherit}button{border:0;border-radius:12px;padding:10px 14px;background:#819178;color:white;cursor:pointer}button.secondary{background:#e9eee5;color:#455642}button.danger{background:#f5e6e1;color:#9a4b40}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{border:1px solid #d5dcd1;border-radius:10px;padding:10px;background:white;max-width:100%;width:100%}label{display:block;margin:12px 0 5px;font-size:14px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e4e8df;display:flex;justify-content:center;gap:5px;padding:9px 4px env(safe-area-inset-bottom)}nav button{font-size:12px;flex:1;max-width:155px;background:transparent;color:#6c7868;padding:10px 4px}nav button.active{background:#e9eee5;color:#3c573d}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.muted{color:#798476;font-size:13px}.pill{border-radius:50px;background:#eef1e9;padding:5px 9px;font-size:12px}.warn{color:#a15a31}.photo{width:64px;height:64px;object-fit:cover;border-radius:12px;background:#e9eee5}.medrow{display:flex;gap:12px;align-items:center}.medrow>div{flex:1}.hidden{display:none}form{margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}p{line-height:1.6}.line-icon{flex:none;vertical-align:middle}.reminder-heading{display:flex;align-items:center;gap:9px}.reminder-heading .line-icon{width:21px;height:21px;color:#77866e}.reminder-due,.reminder-future,.reminder-off{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:7px 10px;line-height:1.5}.reminder-due{color:#94574e;background:#fbefec;border:1px solid #e9cbc5;border-left:3px solid #b87669;font-weight:700}.reminder-future{color:#777c73;background:#f7f7f2;border:1px solid #ebece5;font-weight:500}.reminder-off{color:#8a8c84;background:#f6f6f2;border:1px solid #ecece6;font-weight:500}

</style></head><body><main><header><small>PERSONAL MEDICATION JOURNAL</small><h1>藥物使用紀錄</h1><label for="person">目前查看</label><select id="person"><option value="自己">自己</option></select><div class="row" style="margin-top:8px"><button class="secondary" onclick="addFamily()">＋ 新增家人</button><button class="secondary" onclick="renameFamily()">修改家人名稱</button></div><select id="unused" class="hidden"></select></header><section id="content"></section><section class="card"><h2>資料備份</h2><p class="muted">下載 JSON 備份檔，保存自己與家人的藥物、補給及服藥紀錄。檔案含個人健康資料，請妥善保管。</p><div class="row"><button class="secondary" onclick="exportData()">下載備份</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">還原備份</button></div><input class="hidden" type="file" id="restoreFile" accept=".json,application/json" onchange="importData(event)"></section></main><nav><button data-tab="today" class="active">今日用藥</button><button data-tab="meds">我的藥物</button><button data-tab="stock">庫存管理</button><button data-tab="history">歷史紀錄</button><button data-tab="reminders">用藥提醒</button></nav><script>
const KEY='medication-journal-v1';
const PRE_V16_BACKUP_KEY='medication-journal-v1-pre-v16-backup';
let db,storageRecoveryMode=false;
const rawAtStartup=localStorage.getItem(KEY);
// 在擴充資料結構前，先保存第十五版原始資料；只建立一次，不覆蓋既有快照。
if(rawAtStartup!==null && localStorage.getItem(PRE_V16_BACKUP_KEY)===null){
 try{localStorage.setItem(PRE_V16_BACKUP_KEY,rawAtStartup)}catch(e){console.warn('無法建立自動升級快照，請先使用 App 的「下載備份」。',e)}
}
try{
 db=rawAtStartup?JSON.parse(rawAtStartup):{meds:[],logs:[]};
 if(!db || typeof db!=='object' || !Array.isArray(db.meds) || !Array.isArray(db.logs)) throw new Error('資料結構不完整');
}catch(e){
 storageRecoveryMode=true;
 db={meds:[],logs:[]};
 console.error('原有資料無法解析；已啟用保護模式，不會寫入或覆蓋原始資料。',e);
}
// 向後相容：舊版沒有的新欄位只補預設值，不重建或清空既有資料。
if(!storageRecoveryMode){
 db.families=Array.isArray(db.families)?db.families:[...new Set(db.meds.map(m=>m.person).filter(p=>p!=='自己'))];
 db.restocks=Array.isArray(db.restocks)?db.restocks:[];
 db.reminders=db.reminders&&typeof db.reminders==='object'&&!Array.isArray(db.reminders)?db.reminders:{};
 db.reminderTimes=db.reminderTimes&&typeof db.reminderTimes==='object'&&!Array.isArray(db.reminderTimes)?db.reminderTimes:{};
 db.allergies=Array.isArray(db.allergies)?db.allergies:[];
 db.unopenedStocks=Array.isArray(db.unopenedStocks)?db.unopenedStocks:[];
 db.purchaseNotes=db.purchaseNotes&&typeof db.purchaseNotes==='object'&&!Array.isArray(db.purchaseNotes)?db.purchaseNotes:{};
}else{db.families=[];db.restocks=[];db.reminders={};db.reminderTimes={};db.allergies=[];db.unopenedStocks=[];db.purchaseNotes={};}
let tab='today';const $=id=>document.getElementById(id),person=()=> $('person').value;const today=()=>new Date().toLocaleDateString('sv-SE');
const save=()=>{if(storageRecoveryMode){alert('為保護原有資料，目前已停止寫入。請先下載／保留原始資料並使用「還原備份」修復；請勿清除網站資料。');return}try{localStorage.setItem(KEY,JSON.stringify(db));render()}catch(e){alert('儲存失敗，資料尚未確認寫入。請先下載備份，並檢查裝置可用空間。');console.error(e)}};const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const meds=()=>db.meds.filter(m=>m.person===person()&&m.active!==false);const allMeds=()=>db.meds.filter(m=>m.person===person());const low=m=>m.stock<=m.threshold||(m.type==='fixed'&&m.daily>0&&m.days>0&&m.stock/m.daily<=m.days);function medGlyph(m){
 const key=String([m.name,m.info,m.unit].join(' '));let shape;
 if(/膠囊|capsule/i.test(key))shape='<rect x="4" y="9" width="24" height="14" rx="7" transform="rotate(-38 16 16)"/><path d="M10.5 21.5 21.5 10.5"/>';
 else if(/錠|片|tablet|鈣片/i.test(key))shape='<ellipse cx="16" cy="16" rx="11" ry="8"/><path d="M6 20 26 12"/>';
 else if(/瓶|液|滴|水|糖漿/i.test(key))shape='<path d="M12 4h8v5h-8zM11 9h10l3 5v13H8V14z"/><path d="M11 19h10"/>';
 else if(/包|粉|袋|益生菌/i.test(key))shape='<path d="M9 5h14l2 22H7z"/><path d="M11 10h10M12 15h8"/>';
 else if(/膏|乳|霜/i.test(key))shape='<path d="M11 4h10l4 21H7zM7 25h18M12 10h8"/>';
 else shape='<path d="M12 4h8v5h-8zM10 9h12l3 6v12H7V15z"/><path d="M11 19h10M16 14v10M12 19h8"/>';
 return `<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${shape}</svg>`;
}
const pic=m=>m.photo?`<img class="photo" src="${m.photo}" alt="藥物照片">`:`<span class="photo-placeholder" role="img" aria-label="藥物預設線條圖示">${medGlyph(m)}</span>`;
function lineMessage(m){
 return `藥物庫存提醒\n使用者：${m.person}\n藥物：${m.name}`;
}
async function imageFile(m){
 if(!m.photo)return null;
 const response=await fetch(m.photo);
 const blob=await response.blob();
 const type=blob.type||'image/png';
 const ext=type.includes('jpeg')?'jpg':type.includes('webp')?'webp':'png';
 return new File([blob],`藥物照片.${ext}`,{type});
}
function shareText(m){
 window.open('https://line.me/R/msg/text/?'+encodeURIComponent(lineMessage(m)),'_blank','noopener,noreferrer');
}
async function shareLine(id){
 const m=db.meds.find(x=>x.id===id);
 if(!m)return alert('找不到藥物。');
 if(m.photo&&navigator.share){
  try{
   const file=await imageFile(m);
   if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    await navigator.share({text:lineMessage(m),files:[file]});
    return;
   }
  }catch(e){
   if(e.name==='AbortError')return;
  }
 }
 shareText(m);
 if(m.photo)alert('目前僅開啟文字分享。若要附上藥物圖片，請從藥物資料卡下載照片，再於 LINE 手動附加。');
}
function downloadMedPhoto(id){
 const m=db.meds.find(x=>x.id===id);
 if(!m?.photo)return alert('這筆藥物尚未上傳照片。');
 const a=document.createElement('a');
 a.href=m.photo;a.download='藥物照片.png';document.body.appendChild(a);a.click();a.remove();
}
function refreshPeople(){const el=$('person'),old=el.value;el.innerHTML=['自己',...db.families.filter(x=>x!=='自己')].map(x=>`<option value="${safe(x)}">${safe(x)}</option>`).join('');if([...el.options].some(o=>o.value===old))el.value=old;}
function addFamily(){let name=prompt('請輸入家人名稱');if(name===null)return;name=name.trim();if(!name||name==='自己'||db.families.includes(name))return alert('名稱不可空白或重複。');db.families.push(name);refreshPeople();$('person').value=name;save()}
function renameFamily(){let old=person();if(old==='自己')return alert('「自己」不能重新命名。');let name=prompt('修改家人名稱',old);if(name===null)return;name=name.trim();if(!name||name==='自己'||(name!==old&&db.families.includes(name)))return alert('名稱不可空白或重複。');db.families=db.families.map(x=>x===old?name:x);db.meds.forEach(m=>{if(m.person===old)m.person=name});db.allergies.forEach(a=>{if(a.person===old)a.person=name});db.unopenedStocks.forEach(x=>{if(x.person===old)x.person=name});if(db.purchaseNotes[old]!==undefined){db.purchaseNotes[name]=db.purchaseNotes[old];delete db.purchaseNotes[old]}$('person').value=old;refreshPeople();$('person').value=name;save()}
const remaining=m=>m.type==='fixed'&&m.daily>0?Math.floor(m.stock/m.daily):null;
function purchaseList(){
 let selected=meds().filter(m=>document.getElementById('buy-'+m.id)?.checked);
 if(!selected.length)return alert('請先勾選要購買的藥物。');
 let lines=['藥物採購清單','使用者：'+person(),'日期：'+today(),'','待購藥物'];
 for(let i=0;i<selected.length;i++){
  let m=selected[i],qty=Number($('buyqty-'+m.id).value),unit=$('buyunit-'+m.id).value.trim();
  if(!Number.isFinite(qty)||qty<=0||!unit)return alert('請填寫有效的購買數量與單位。');
  lines.push(`${i+1}. ${m.name}：${qty} ${unit}`);
 }
 const note=String(db.purchaseNotes[person()]||'').trim();
 lines.push('','採購說明',note||'（未填寫）');
 return {text:lines.join('\n'),selected};
}
function savePurchaseNote(value){db.purchaseNotes[person()]=value;localStorage.setItem(KEY,JSON.stringify(db))}
async function sharePurchaseCard(){
 const result=purchaseList();if(!result)return;
 if(navigator.share){try{await navigator.share({title:'藥物採購清單',text:result.text});return}catch(e){if(e.name==='AbortError')return}}
 window.open('https://line.me/R/msg/text/?'+encodeURIComponent(result.text),'_blank','noopener,noreferrer');
}
// 保留舊版「LINE 分享採購文字／原始照片」：分享所勾選藥物的採購文字，並嘗試附上原始藥物照片。
async function sharePurchaseTextOriginalPhotos(){
 const result=purchaseList();if(!result)return;
 const photoMeds=result.selected.filter(m=>m.photo);
 if(!photoMeds.length){
  window.open('https://line.me/R/msg/text/?'+encodeURIComponent(result.text),'_blank','noopener,noreferrer');
  alert('已開啟採購文字分享；目前勾選的藥物沒有原始照片。');
  return;
 }
 if(navigator.share){
  try{
   const files=[];
   for(const m of photoMeds){const f=await imageFile(m);if(f)files.push(new File([f],`${String(m.name||'藥物').replace(/[\\/:*?"<>|]/g,'_')}_${f.name}`,{type:f.type||'image/png'}));}
   if(files.length&&navigator.canShare&&navigator.canShare({files})){
    await navigator.share({title:'藥物採購清單',text:result.text,files});
    return;
   }
  }catch(e){if(e.name==='AbortError')return;}
 }
 window.open('https://line.me/R/msg/text/?'+encodeURIComponent(result.text),'_blank','noopener,noreferrer');
 alert('已開啟採購文字分享。此瀏覽器無法將文字與多張原始照片一次附加至 LINE；請從各藥物資料卡下載照片，再於 LINE 手動附加。');
}
async function sharePurchase(){return sharePurchaseCard()}
function toggleAllergyReminderField(){
 const field=$('allergyReminderWrap');if(!field)return;
 field.classList.toggle('hidden',$('allergyStatus')?.value!=='疑似反應');
}
function addAllergy(){
 const name=$('allergyName').value.trim(),ingredient=$('allergyIngredient').value.trim(),note=$('allergyNote').value.trim(),status=$('allergyStatus').value;
 const allergyPerson=$('allergyPerson').value.trim(),providedDate=$('allergyProvidedDate').value;
 const reminderContent=status==='疑似反應'?$('allergyReminderContent').value.trim():'';
 if(!name&&!ingredient&&!note)return alert('請至少填寫藥物名稱、成分或反應備註其中一項。');
 if(!allergyPerson)return alert('請填寫過敏者名稱。');
 db.allergies.push({id:crypto.randomUUID(),person:person(),allergyPerson,providedDate,reminderContent,name,ingredient,note,status,createdAt:new Date().toISOString()});save();
}
function deleteAllergy(id){if(!confirm('確定刪除此筆過敏史紀錄？'))return;db.allergies=db.allergies.filter(a=>a.id!==id);save()}
function allergyProvidedDate(a){return a.providedDate||String(a.createdAt||'').slice(0,10)||'未填寫'}
function allergyPersonName(a){return String(a.allergyPerson||'').trim()||'未填寫'}
function shareAllergies(){
 const list=db.allergies.filter(a=>a.person===person());if(!list.length)return alert('目前沒有過敏史紀錄可分享。');
 const lines=['藥物過敏史紀錄','','提醒：本清單為個人紀錄，疑似反應不代表已確診。'];
 list.forEach((a,i)=>{
  lines.push('',`${i+1}. ${a.name||'未填藥名'}`,`過敏者：${allergyPersonName(a)}`,`提供日期：${allergyProvidedDate(a)}`,`藥物成分：${a.ingredient||'未填寫'}`,`紀錄狀態：${a.status||'未註明'}`,`反應／備註：${a.note||'未填寫'}`);
  if(a.status==='疑似反應'&&a.reminderContent)lines.push(`提醒內容：${a.reminderContent}`);
 });
 const text=lines.join('\n');if(navigator.share){navigator.share({title:'藥物過敏史紀錄',text}).catch(e=>{if(e.name!=='AbortError')window.open('https://line.me/R/msg/text/?'+encodeURIComponent(text),'_blank','noopener,noreferrer')});return}window.open('https://line.me/R/msg/text/?'+encodeURIComponent(text),'_blank','noopener,noreferrer');
}
function exportAllergiesPDF(){
 const list=db.allergies.filter(a=>a.person===person());if(!list.length)return alert('目前沒有過敏史紀錄可匯出。');
 const rows=list.map((a,i)=>`<article><h3>${i+1}. ${safe(a.name||'未填藥名')}</h3><p><b>過敏者：</b>${safe(allergyPersonName(a))}</p><p><b>提供日期：</b>${safe(allergyProvidedDate(a))}</p><p><b>藥物成分：</b>${safe(a.ingredient||'未填寫')}</p><p><b>紀錄狀態：</b>${safe(a.status||'未註明')}</p><p><b>反應／備註：</b>${safe(a.note||'未填寫')}</p>${a.status==='疑似反應'&&a.reminderContent?`<p><b>提醒內容：</b>${safe(a.reminderContent)}</p>`:''}</article>`).join('');
 const w=window.open('','_blank');if(!w)return alert('瀏覽器阻擋了新視窗，請允許此網站開啟視窗後再試。');
 w.document.write(`<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>藥物過敏史紀錄</title><style>body{font-family:Arial,"Noto Sans TC",sans-serif;color:#354238;padding:28px;line-height:1.7}h1{font-size:22px}article{border-bottom:1px solid #ddd;padding:8px 0;break-inside:avoid}.muted{color:#666;font-size:12px}@media print{button{display:none}}</style></head><body><h1>藥物過敏史紀錄</h1><p>匯出日期：${today()}</p><p class="muted">注意：本紀錄供就醫溝通參考；疑似反應不代表已確診，請由醫療專業人員評估。</p>${rows}<script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close();
}
function addUnopened(){
 const medId=$('unopenedMed').value,med=db.meds.find(m=>m.id===medId&&m.person===person());
 const packages=Number($('unopenedQty').value),unit=$('unopenedUnit').value.trim(),per=Number($('unopenedPerPack').value),expiry=$('unopenedExpiry').value;
 if(!med)return alert('請先選擇目前使用者的藥物。');if(!Number.isFinite(packages)||packages<=0||!unit||!Number.isFinite(per)||per<=0)return alert('請填寫有效的未拆封數量、包裝單位及每包裝含量。');
 db.unopenedStocks.push({id:crypto.randomUUID(),person:person(),medId,packages,unit,perPack:per,remainingUnits:packages*per,expiry,createdAt:new Date().toISOString()});save();
}
function transferUnopened(id){
 const x=db.unopenedStocks.find(v=>v.id===id&&v.person===person());if(!x)return;const m=db.meds.find(v=>v.id===x.medId&&v.person===person());if(!m)return alert('找不到對應藥物，請確認藥物資料。');
 const qty=Number(prompt(`轉入多少${m.unit}至使用中庫存？\n未拆封庫存約剩 ${x.remainingUnits} ${m.unit}`,String(Math.min(x.remainingUnits,x.perPack))));
 if(!Number.isFinite(qty)||qty<=0)return;if(qty>x.remainingUnits+1e-8)return alert('轉入數量不可超過未拆封藥物剩餘含量。');
 if(!confirm(`確認將 ${qty} ${m.unit} 的「${m.name}」轉入使用中庫存？`))return;
 m.stock=+(m.stock+qty).toFixed(4);x.remainingUnits=+(x.remainingUnits-qty).toFixed(4);x.packages=x.remainingUnits/x.perPack;
 db.restocks.push({id:crypto.randomUUID(),medId:m.id,qty,at:new Date().toISOString(),source:'unopened-transfer'});
 if(x.remainingUnits<=1e-8)db.unopenedStocks=db.unopenedStocks.filter(v=>v.id!==id);save();
}
function deleteUnopened(id){if(!confirm('確定刪除這筆未拆封庫存紀錄？'))return;db.unopenedStocks=db.unopenedStocks.filter(x=>x.id!==id);save()}
function confirmRestocks(){let updates=[];for(const m of meds()){let q=Number($('restock-'+m.id)?.value||0);if(!Number.isFinite(q)||q<0)return alert('補給數量不可為負數。');if(q>0)updates.push({m,q})}if(!updates.length)return alert('請輸入新增補給數量。');if(!confirm('確認已收到這些藥物並增加實際庫存？'))return;for(const {m,q} of updates){m.stock=+(m.stock+q).toFixed(4);db.restocks.push({id:crypto.randomUUID(),medId:m.id,qty:q,at:new Date().toISOString()})}save()}
function requestNotifications(){if(!('Notification' in window))return alert('此裝置或瀏覽器不支援通知。');Notification.requestPermission().then(x=>alert('通知權限：'+x+'。這不是背景推播啟用確認；仍需另外建置推播服務。'))}
// 本機提醒設定只針對「自己」，不因查看其他家人而變更。
function reminderKey(m){return String(m.id)}
function reminderEnabled(m){return db.reminders[reminderKey(m)]!==false}
function setReminder(id,enabled){db.reminders[id]=enabled;save()}
function reminderTimes(m){
 const id=reminderKey(m),stored=db.reminderTimes[id];
 if(Array.isArray(stored))return stored.filter(t=>/^([01]\d|2[0-3]):[0-5]\d$/.test(t)).sort();
 return String(m.times||'').split(',').map(t=>t.trim()).filter(t=>/^([01]\d|2[0-3]):[0-5]\d$/.test(t));
}
function addReminderTime(id){
 const input=document.getElementById('new-time-'+id),t=input?.value;
 if(!t||!/^([01]\d|2[0-3]):[0-5]\d$/.test(t))return alert('請選擇有效的提醒時間');
 const m=db.meds.find(x=>String(x.id)===String(id));if(!m||m.person!=='自己')return;
 const a=reminderTimes(m);if(a.includes(t))return alert('這個時間已經設定過了');
 db.reminderTimes[id]=[...a,t].sort();save();
}
function removeReminderTime(id,t){
 const m=db.meds.find(x=>String(x.id)===String(id));if(!m||m.person!=='自己')return;
 db.reminderTimes[id]=reminderTimes(m).filter(x=>x!==t);save();
}
function editReminderTime(id,oldTime,idx){
 const input=document.getElementById('edit-time-'+id+'-'+idx),t=input?.value;
 if(!t||!/^([01]\d|2[0-3]):[0-5]\d$/.test(t))return alert('請選擇有效的提醒時間');
 const m=db.meds.find(x=>String(x.id)===String(id));if(!m||m.person!=='自己')return;
 const a=reminderTimes(m);if(t!==oldTime&&a.includes(t))return alert('這個時間已經設定過了');
 db.reminderTimes[id]=a.map(x=>x===oldTime?t:x).sort();save();
}
function ownFixedMeds(){return db.meds.filter(m=>m.person==='自己'&&m.active!==false&&m.type==='fixed')}
function lineIcon(name){const shapes={"bell": "<path d=\"M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z\"/><path d=\"M10 21h4\"/>", "clock": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/>", "check": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m8 12 2.7 2.7L16 9\"/>", "off": "<path d=\"M18 8a6 6 0 0 0-10-4.5M6 8c0 7-3 7-3 9h14M10 21h4M3 3l18 18\"/>"};return `<svg class="line-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${shapes[name]||shapes.clock}</svg>`}
function reminderPanel(){
 let list=ownFixedMeds(),out='<h2 class="reminder-heading">'+lineIcon('bell')+' 每日用藥提醒（僅限自己）</h2><div class="card"><strong>提醒對象固定為「自己」</strong><p class="muted">不論上方切換查看哪位家人，此頁只顯示本機「自己」的固定用藥。設定會保存在這支手機。</p><p class="muted">目前提供 App 內到時／逾時提示及提醒開關。iPhone 關閉 App 後的背景推播尚未啟用，不能依賴本功能作為唯一服藥提醒。</p><button class="secondary" onclick="requestNotifications()">檢查通知權限（非啟用背景推播）</button></div>';
 if(!list.length)return out+'<div class="card">「自己」尚未建立固定服用藥物。請先切換至「自己」，到「我的藥物」建立藥物及時間。</div>';
 let now=new Date(),clock=now.toTimeString().slice(0,5);
 for(const m of list){
  let times=reminderTimes(m),on=reminderEnabled(m);
  let entries=times.map((t,i)=>{
   // 提醒時段與原服藥時段分開；不可把提醒狀態誤認為服藥確認。
   // 只有同一藥物、同一天、同一原始服藥時段的確認紀錄，才標示為已服藥。
   const done=db.logs.some(l=>String(l.medId)===String(m.id)&&l.date===today()&&l.slot===t);
   let due=on&&t<=clock;let state=!on?'提醒已關閉':done?'已完成服藥':due?'已到提醒時間，請確認是否服藥':'尚未到提醒時間';let stateClass=!on?'reminder-off':done?'reminder-done':due?'reminder-due':'reminder-future';let statusIcon=lineIcon(!on?'off':done?'check':due?'bell':'clock');
   return `<div class="muted" style="margin:7px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap"><input aria-label="提醒時間" type="time" id="edit-time-${m.id}-${i}" value="${safe(t)}" style="width:130px"><button class="secondary" onclick="editReminderTime('${m.id}','${t}',${i})">修改</button><button class="secondary" onclick="removeReminderTime('${m.id}','${t}')">刪除</button><span class="${stateClass}" role="status">${statusIcon}<span>${state}</span></span></div>`;
  }).join('');
  out+=`<div class="card medrow">${pic(m)}<div style="flex:1;min-width:0"><strong>${safe(m.name)}</strong><div class="muted">每次 ${safe(m.dose)} ${safe(m.unit)}</div>${entries||'<div class="muted">請設定提醒時間</div>'}<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px"><input type="time" aria-label="新增提醒時間" id="new-time-${m.id}" value="08:00" style="width:130px"><button class="secondary" onclick="addReminderTime('${m.id}')">＋ 新增時間</button></div></div><label style="white-space:nowrap"><input type="checkbox" style="width:auto" ${on?'checked':''} onchange="setReminder('${m.id}',this.checked)"> 提醒</label></div>`;
 }
 return out+'<p class="muted">提醒時間獨立於原服藥排程，不會自動新增服藥紀錄或扣庫存。只有提醒時間與「今日用藥」已確認的原服藥時段一致，才顯示綠色「已完成服藥」；其他時段仍須到「今日用藥」確認。App 關閉後尚無背景推播。</p>';
}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(storageRecoveryMode){$('content').innerHTML='<div class="card"><h2>資料保護模式</h2><p>系統無法安全讀取原有資料，因此已停止儲存，避免覆蓋資料。請先使用「資料備份」下載原始復原檔，或以先前 JSON 備份還原。請不要清除網站資料或移除 App。</p></div>';return}let out='';if(tab==='reminders'){out=reminderPanel()}if(tab==='today'){out=`<h2>今日用藥 <span class="muted">${today()}</span></h2><div class="card"><strong>每日用藥提醒</strong><p class="muted">開啟 App 可查看今日用藥與服藥確認。iPhone 在 App 關閉後的定時推播尚需後端推播服務，現階段尚未啟用。</p><button class="secondary" onclick="requestNotifications()">檢查通知權限</button></div>`;let fixed=meds().filter(m=>m.type==='fixed');out+=fixed.length?'':'<div class="card">尚未建立固定服用的藥物，請到「我的藥物」新增。</div>';for(const m of fixed){let times=(m.times||'').split(',').map(x=>x.trim()).filter(Boolean);for(const t of times){let done=db.logs.some(l=>l.medId===m.id&&l.slot===t&&l.date===today());out+=`<div class="card medrow">${pic(m)}<div><strong>${safe(m.name)}</strong><div class="muted">${safe(t)} · ${m.dose} ${safe(m.unit)}</div></div><button class="${done?'secondary':''}" onclick="toggleDose('${m.id}','${safe(t)}')">${done?'✓ 已服用':'已服用'}</button></div>`}}out+='<h2>需要時服用</h2>';let prn=meds().filter(m=>m.type==='prn');out+=prn.length?'':'<div class="card">尚未建立需要時服用的藥物。</div>';for(const m of prn)out+=`<div class="card medrow">${pic(m)}<div><strong>${safe(m.name)}</strong><div class="muted">庫存 ${m.stock} ${safe(m.unit)}</div></div><button onclick="takePrn('${m.id}')">記錄服用</button></div>`}
if(tab==='meds'){out='<h2>我的藥物</h2><button onclick="showForm()">＋ 新增藥物</button><div id="editor"></div>';for(const m of meds())out+=`<div class="card medrow">${pic(m)}<div><strong>${safe(m.name)}</strong><div class="muted">${safe(m.info||'尚未填寫用途')} · ${m.type==='fixed'?'固定服用':'需要時服用'}</div><div class="muted">庫存 ${m.stock} ${safe(m.unit)}${m.expiry?' · 有效期限 '+safe(m.expiry):''}${m.acquired?' · 取得日期 '+safe(m.acquired):''}</div></div><button class="secondary" onclick="showForm('${m.id}')">編輯</button></div>`;out+='<h2>藥物過敏史</h2><p class="muted">依目前選取的使用者分開保存；「過敏者」可自行輸入姓名。若只是懷疑，請選「疑似反應」並描述實際症狀。</p><div class="card"><label>過敏者（必填）</label><input id="allergyPerson" placeholder="請自行輸入姓名（包含自己）"><p class="muted">即使過敏者是自己，也請在此手動輸入姓名；不會自動帶入 App 使用者名稱。</p><label>提供日期</label><input id="allergyProvidedDate" type="date" value="'+today()+'"><label>藥物名稱</label><input id="allergyName" placeholder="例如：某藥品名稱"><label>藥物成分</label><input id="allergyIngredient" placeholder="知道成分時再填寫"><label>紀錄狀態</label><select id="allergyStatus" onchange="toggleAllergyReminderField()"><option>疑似反應</option><option>醫療人員確認</option><option>尚待確認</option></select><div id="allergyReminderWrap"><label>提醒內容（僅疑似反應顯示）</label><textarea id="allergyReminderContent" placeholder="例如：再次使用前先向醫師或藥師確認"></textarea></div><label>反應／備註</label><textarea id="allergyNote" placeholder="例如：服用後出現紅疹、發生時間、曾否就醫"></textarea><button onclick="addAllergy()">新增過敏史</button></div>';for(const a of db.allergies.filter(a=>a.person===person()))out+=`<div class="card"><div class="row"><strong>${safe(a.name||'未填藥名')}</strong><span class="pill">${safe(a.status||'未註明')}</span></div><div class="muted">過敏者：${safe(allergyPersonName(a))} · 提供日期：${safe(allergyProvidedDate(a))}</div><div class="muted">藥物成分：${safe(a.ingredient||'未填寫')}</div><p>${safe(a.note||'未填寫反應／備註')}</p>${a.status==='疑似反應'&&a.reminderContent?`<p><strong>提醒內容：</strong>${safe(a.reminderContent)}</p>`:''}<button class="secondary" onclick="deleteAllergy('${a.id}')">刪除紀錄</button></div>`;out+='<div class="row"><button class="secondary" onclick="shareAllergies()">LINE 分享過敏史</button><button class="secondary" onclick="exportAllergiesPDF()">匯出 PDF</button></div>'}
if(tab==='stock'){out='<h2>庫存管理</h2><h3>庫存剩餘天數提醒</h3>';for(const m of meds()){let days=remaining(m);out+=`<div class="card row"><div><strong>${safe(m.name)}</strong><div class="muted">庫存 ${m.stock} ${safe(m.unit)} · ${days===null?'不固定服用，無法估算天數':`約剩 ${days} 天`}</div></div><span class="${low(m)?'warn':'muted'}">${low(m)?'⚠️ 需留意':'正常'}</span></div>`}out+='<h3>實際藥物補給</h3><p class="muted">僅在實際領取或購買到藥物後填寫；以顆、錠、毫升等庫存單位計算。</p>';for(const m of meds())out+=`<div class="card"><strong>${safe(m.name)}</strong><div class="muted">目前庫存：${m.stock} ${safe(m.unit)}</div><label>新增補給數量（${safe(m.unit)}）</label><input id="restock-${m.id}" type="number" min="0" step="any" value="0"></div>`;out+='<button onclick="confirmRestocks()">確認補給並更新庫存</button><h3>未拆封藥物</h3><p class="muted">未拆封數量與使用中庫存分開保存。新增時請填每盒／瓶可使用的庫存單位數；轉入時會要求手動確認數量。</p><div class="card"><label>藥物</label><select id="unopenedMed">'+meds().map(m=>`<option value="${m.id}">${safe(m.name)}（${safe(m.unit)}）</option>`).join('')+'</select><div class="grid"><div><label>未拆封包裝數量</label><input id="unopenedQty" type="number" min="0.001" step="any" value="1"></div><div><label>包裝單位</label><input id="unopenedUnit" value="盒"></div><div><label>每包裝含量（庫存單位）</label><input id="unopenedPerPack" type="number" min="0.001" step="any" value="30"></div><div><label>有效期限</label><input id="unopenedExpiry" type="date"></div></div><button onclick="addUnopened()" '+(meds().length?'':'disabled')+'>新增未拆封藥物</button></div>';for(const x of db.unopenedStocks.filter(x=>x.person===person())){const m=db.meds.find(m=>m.id===x.medId);if(!m)continue;const expired=x.expiry&&x.expiry<today(),soon=x.expiry&&x.expiry>=today()&&Math.ceil((new Date(x.expiry)-new Date(today()))/86400000)<=30;out+=`<div class="card"><div class="row"><strong>${safe(m.name)}</strong><span class="${expired||soon?'warn':'muted'}">${expired?'已過期':soon?'期限將近':'未拆封'}</span></div><div class="muted">約剩 ${Number(x.remainingUnits.toFixed(4))} ${safe(m.unit)}（${Number((x.remainingUnits/x.perPack).toFixed(2))} ${safe(x.unit)}） · 有效期限：${safe(x.expiry||'未填寫')}</div><div class="row"><button onclick="transferUnopened('${x.id}')">手動轉入使用中庫存</button><button class="secondary" onclick="deleteUnopened('${x.id}')">刪除</button></div></div>`}out+='<h3>待購藥物清單</h3><p class="muted">採購卡片改為純文字，不附藥物圖片。採購說明會與勾選項目一併分享；不顯示剩餘天數或現有庫存，也不會因建立／分享清單而改變庫存。</p>';for(const m of meds())out+=`<div class="card"><label><input style="width:auto" type="checkbox" id="buy-${m.id}"> <strong>${safe(m.name)}</strong></label><div class="grid"><div><label>購買數量</label><input type="number" min="0.001" step="any" id="buyqty-${m.id}" value="${Number(m.buyQty)||1}"></div><div><label>購買單位</label><input id="buyunit-${m.id}" value="${safe(m.buyUnit||'盒')}"></div></div></div>`;out+=`<div class="card"><label>採購說明（選填）</label><textarea id="purchaseNote" placeholder="輸入品牌、替代品確認方式或其他採購需求">${safe(db.purchaseNotes[person()]||'')}</textarea><p class="muted">說明會依目前選取的使用者保存，並一同匯出到採購文字。</p></div><div class="row" style="flex-wrap:wrap;gap:8px"><button onclick="sharePurchaseCard()">分享採購卡片（純文字）</button><button class="secondary" onclick="sharePurchaseTextOriginalPhotos()">LINE 分享採購文字／原始照片</button></div>`;if(!meds().length)out+='<div class="card">目前沒有正在使用的藥物。</div>'}
if(tab==='history'){out='<h2>服藥歷史</h2>';let ids=new Set(meds().map(m=>m.id));let logs=db.logs.filter(l=>ids.has(l.medId)).sort((a,b)=>b.at.localeCompare(a.at));for(const l of logs){let m=db.meds.find(m=>m.id===l.medId);out+=`<div class="card row"><div><strong>${safe(m?.name||'已刪除藥物')}</strong><div class="muted">${safe(l.at.replace('T',' '))} · ${l.qty} ${safe(m?.unit||'')}</div></div><button class="secondary" onclick="undo('${l.id}')">撤銷</button></div>`}if(!logs.length)out+='<div class="card">尚無服藥紀錄。</div>'} $('content').innerHTML=out;const pn=$('purchaseNote');if(pn)pn.addEventListener('input',e=>savePurchaseNote(e.target.value));if($('allergyStatus'))toggleAllergyReminderField()}
function addLog(m,qty,slot=''){if(!Number.isFinite(qty)||qty<=0)return alert('服用量必須大於 0，可以輸入整數或小數。');if(m.stock<qty)return alert('庫存不足，請先補充庫存。');m.stock=+(m.stock-qty).toFixed(4);db.logs.push({id:crypto.randomUUID(),medId:m.id,qty,slot,date:today(),at:new Date().toLocaleString('sv-SE').replace(' ','T')});save();if(low(m))alert(`${m.name} 已達庫存提醒條件。`)}
function undo(id){let i=db.logs.findIndex(l=>l.id===id);if(i<0)return;let l=db.logs[i],m=db.meds.find(m=>m.id===l.medId);if(m)m.stock=+(m.stock+l.qty).toFixed(4);db.logs.splice(i,1);save()}
function toggleDose(id,slot){let m=db.meds.find(x=>x.id===id);let l=db.logs.find(x=>x.medId===id&&x.slot===slot&&x.date===today());if(l){if(confirm('取消這次服藥紀錄並恢復庫存？'))undo(l.id)}else addLog(m,m.dose,slot)}
function takePrn(id){let m=db.meds.find(x=>x.id===id);let q=Number(prompt(`本次服用 ${m.name} 幾${m.unit}？`,m.dose));if(Number.isFinite(q)&&q>0)addLog(m,q)}
function restock(id){let m=db.meds.find(x=>x.id===id),q=Number(prompt(`要補充多少 ${m.unit}？`,'10'));if(Number.isFinite(q)&&q>0){m.stock=+(m.stock+q).toFixed(4);save()}}

 <div><label>預設購買數量</label><input name="buyQty" type="number" step="any" min="0.001" value="${m.buyQty||1}"></div>
 <div><label>每包裝含量（選填）</label><input name="packSize" type="number" step="any" min="0" value="${m.packSize||''}"></div>
 <div class="full"><label>搜尋藥物圖片</label><div class="row"><input id="lookupTerm" placeholder="輸入藥物名稱或外觀特徵" value="${safe(m.name)}"><button type="button" class="secondary" onclick="lookupMedicine()">搜尋圖片</button></div><div class="row" style="margin-top:10px;flex-wrap:wrap;justify-content:flex-start"><button type="button" class="secondary" onclick="lookupTaiwanMedicine()">搜尋台灣藥品資料</button></div><p class="muted">圖片與台灣藥品資料搜尋會在新分頁開啟；「搜尋台灣藥品資料」使用一般網頁搜尋查找台灣藥品資料，並非 App 直接讀取官方資料庫。請以藥袋、許可證字號、劑型及含量核對。若要儲存照片，請使用下方「藥物照片」上傳自己拍攝或有權使用的圖片。</p></div>
 <div class="full"><label>藥物照片（選填）</label><input type="file" id="photoInput" accept="image/*"><p class="muted">圖片會儲存在此瀏覽器，建議使用小尺寸照片。</p></div>
 </div><div class="row"><button type="submit">儲存藥物</button>${id?`<button type="button" class="danger" onclick="deleteMed('${id}')">刪除藥物</button>`:''}<button type="button" class="secondary" onclick="render()">取消</button></div></form>`;
 $('medform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let v={id:id||crypto.randomUUID(),person:person(),name:f.get('name').trim(),info:f.get('info'),expiry:f.get('expiry')||'',acquired:f.get('acquired')||'',license:f.get('license'),source:f.get('source').trim(),type:f.get('type'),unit:f.get('unit')||'顆',buyUnit:f.get('buyUnit')||'盒',buyQty:Number(f.get('buyQty'))||1,packSize:Number(f.get('packSize'))||0,active:m.active!==false,dose:Number(f.get('dose')),daily:Number(f.get('daily')),times:f.get('times'),stock:Number(f.get('stock')),threshold:Number(f.get('threshold')),days:Number(f.get('days')),photo:m.photo};if(!Number.isFinite(v.dose)||v.dose<=0||!Number.isFinite(v.daily)||v.daily<0||!Number.isFinite(v.stock)||v.stock<0||!Number.isSafeInteger(v.threshold)||v.threshold<0||!Number.isSafeInteger(v.days)||v.days<0){alert('請輸入有效數值；服用量可以是整數或小數，提醒天數須為整數。');return;}let file=$('photoInput').files[0];if(file){v.photo=await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}if(id)db.meds[db.meds.findIndex(x=>x.id===id)]=v;else db.meds.push(v);try{save()}catch{alert('儲存失敗，可能是照片太大，請改用較小的照片。')}}
}
function lookupMedicine(){let q=$('lookupTerm').value.trim();if(!q)return alert('請輸入藥物名稱。');window.open('https://www.google.com/search?tbm=isch&q='+encodeURIComponent(q+' 藥物 外觀'),'_blank','noopener,noreferrer')}
function lookupTaiwanMedicine(){let q=$('lookupTerm').value.trim();if(!q)return alert('請輸入藥物名稱。');window.open('https://www.google.com/search?q='+encodeURIComponent(q+' 台灣 藥品 資料 許可證'),'_blank','noopener,noreferrer')}

function exportData(){const data=storageRecoveryMode?rawAtStartup:JSON.stringify({format:'medication-journal',version:5,families:db.families,restocks:db.restocks,reminders:db.reminders,reminderTimes:db.reminderTimes,allergies:db.allergies,unopenedStocks:db.unopenedStocks,purchaseNotes:db.purchaseNotes,exportedAt:new Date().toISOString(),meds:db.meds,logs:db.logs},null,2);const url=URL.createObjectURL(new Blob([data||''],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=storageRecoveryMode?'藥物使用紀錄_原始資料復原檔.json':'藥物使用紀錄_備份_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
async function importData(event){const file=event.target.files?.[0];if(!file)return;try{if(file.size>12*1024*1024)throw Error('備份檔過大');const v=JSON.parse(await file.text());if(v.format!=='medication-journal'||!Array.isArray(v.meds)||!Array.isArray(v.logs))throw Error('備份格式不正確');if(v.meds.some(m=>typeof m.id!=='string'||typeof m.person!=='string'||typeof m.name!=='string'||!Number.isFinite(m.stock))||v.logs.some(l=>typeof l.id!=='string'||typeof l.medId!=='string'||!Number.isFinite(l.qty)))throw Error('備份資料格式不正確');if(!confirm('還原將覆蓋目前所有藥物與服藥紀錄。確定繼續？'))return;const old=db,oldRecoveryMode=storageRecoveryMode;db={meds:v.meds,logs:v.logs,families:Array.isArray(v.families)?v.families:[...new Set(v.meds.map(m=>m.person).filter(x=>x!=='自己'))],restocks:Array.isArray(v.restocks)?v.restocks:[],reminders:v.reminders&&typeof v.reminders==='object'&&!Array.isArray(v.reminders)?v.reminders:{},reminderTimes:v.reminderTimes&&typeof v.reminderTimes==='object'&&!Array.isArray(v.reminderTimes)?v.reminderTimes:{},allergies:Array.isArray(v.allergies)?v.allergies:[],unopenedStocks:Array.isArray(v.unopenedStocks)?v.unopenedStocks:[],purchaseNotes:v.purchaseNotes&&typeof v.purchaseNotes==='object'&&!Array.isArray(v.purchaseNotes)?v.purchaseNotes:{}};storageRecoveryMode=false;refreshPeople();try{localStorage.setItem(KEY,JSON.stringify(db));render();alert('備份還原完成。')}catch(e){db=old;storageRecoveryMode=oldRecoveryMode;alert('儲存失敗，原資料未變更。')}}catch(e){alert('無法還原：'+e.message)}finally{event.target.value=''}}
function deleteMed(id){if(confirm('刪除此藥物？過去的服藥紀錄也會刪除。')){db.meds=db.meds.filter(m=>m.id!==id);db.logs=db.logs.filter(l=>l.medId!==id);save()}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('person').onchange=render;refreshPeople();
if(storageRecoveryMode){$('content').innerHTML='<div class="card"><h2>資料保護模式</h2><p>系統無法安全讀取原有資料，因此已停止儲存，避免覆蓋資料。請不要清除網站資料或移除 App。若你有先前 JSON 備份，請使用下方「還原備份」；原始資料仍保留在此網站儲存空間中。</p></div>';}
else render();
</script></body></html>
